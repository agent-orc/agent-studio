<script>
const q=new URLSearchParams(location.search);const surface=q.get('surface')||'board',version=q.get('version')||'after',theme=q.get('theme')||'light',state=q.get('state')||'normal';document.documentElement.dataset.studioTheme=theme;document.body.className=version+(q.has('capture')?' capture':'');

const cost=trigger('cost',`<span><span class="unit long-label">USD · </span><span class="unit">Today</span> <b data-value>$12.40</b></span><span><span class="unit">W</span> <b data-value>$84.60</b>${state==='budget'?' !':''}</span>`,`cost ${state==='budget'?'alert':''}`,'Estimated list-price cost in USD. Today 12 dollars 40 cents. This week 84 dollars 60 cents. Open cost details');
