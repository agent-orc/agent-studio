<body><header id="header"></header><main id="content"></main><footer class="provenance" id="provenance"></footer>
<dialog id="usage" aria-labelledby="usage-title"><div class="dialog-head"><h2 id="usage-title">Usage</h2><button autofocus onclick="this.closest('dialog').close()" aria-label="Close usage">Close</button></div><div id="sheet"></div></dialog>
<script>
const params=new URLSearchParams(location.search),stage=params.get('stage')||'after',surface=params.get('surface')||'board',theme=params.get('theme')||'light';
document.documentElement.dataset.studioTheme=theme;document.body.className=stage;
const chip=(name,wk,session)=>`<button class="chip" data-cli="${name}" onclick="openUsage('${name}')" aria-haspopup="dialog" aria-label="${name}, weekly ${wk} percent used, current 5 hour window ${session} percent used. Open usage."><b>${name}</b><span class="tag">WK</span><span class="num">${wk}%</span><span class="tag">5H</span><span class="num">${session}%</span></button>`;
const nav=`<nav aria-label="Workspace"><button onclick="openUsage('Usage')">Usage</button><button onclick="openUsage('Navigation')">Orchestrator</button><button class="nav-secondary" onclick="openUsage('Navigation')">Feed</button><button class="nav-secondary" onclick="openUsage('Navigation')">Settings</button><button class="mini-nav" onclick="openUsage('Navigation')">More</button></nav>`;
document.querySelector('#header').innerHTML=stage==='before'?`<div class="top"><div class="old-slots"><span>remote 2/3</span><span>review 1/3</span><span>auto 10/17</span></div><span class="old-quota">Claude &nbsp; 5H 19% &nbsp; WK 7%</span><span class="old-quota old-codex">Codex &nbsp; WK 15…</span>${nav}<span class="old-model">gpt-6-astra medium</span></div>`:`<div class="top"><span class="brand">Studio</span><span class="project">Demo App</span>${nav}<div class="phone-usage"><button data-cli="Codex" onclick="openUsage('Codex')" aria-haspopup="dialog" aria-label="Codex weekly 15 percent used. Open all usage.">Codex WK <b class="num">15%</b></button><button onclick="openUsage('Cost')" aria-haspopup="dialog" aria-label="Today, 12 dollars 48 cents, US dollars. Open usage cost.">Today <b class="num">$12.48</b></button></div><button class="mini-nav" onclick="openUsage('Navigation')" aria-label="Open workspace menu">⋯</button></div><div class="strip" aria-label="Workspace usage">${chip('Codex',15,32)}${chip('Claude',7,19)}<button class="chip" onclick="openUsage('Cost')" aria-haspopup="dialog"><span class="tag">Today</span><span class="num">$12.48</span><span class="tag">USD</span></button><button class="usage-more" onclick="openUsage('Usage')" aria-haspopup="dialog">Details ↓</button></div>`;
const cards=[['DEMO-104','Session recovery','Latest run awaiting evidence','06:24','Running'],['DEMO-102','Usage ledger alignment','Cached input accounted once','03:18','Running'],['DEMO-109','Project setup guide','Acceptance notes attached','Ready','Docs'],['DEMO-111','Keyboard navigation','Focus returns to the trigger','Ready','UI'],['DEMO-098','Workspace health','Review evidence attached','09:12','Evidence']];
const task=(c)=>`<article class="task"><small>${c[0]}</small><h3>${c[1]}</h3><small>${c[2]}</small><div class="meta"><span>${c[3]}</span><span class="badge">${c[4]}</span></div></article>`;
const board=`<div class="view-head"><div><small>Demo App / Workspace</small><h1>Board</h1></div><button class="right chip">New task</button></div><div class="toolbar"><button class="active">All tasks</button><button>Filters</button><span class="muted desktop-only">5 visible tasks</span><button class="phone-lane">Lane: In Progress ↓</button></div><div class="board">${[['In Progress',[cards[0],cards[1]]],['Ready',[cards[2],cards[3]]],['Human review',[cards[4]]]].map(([n,cs])=>`<section class="lane"><div class="lane-head"><span>${n}</span><span class="num">${cs.length}</span></div>${cs.map(task).join('')}</section>`).join('')}</div>`;
const detail=`<div class="view-head"><div><small>Demo App / DEMO-104</small><h1>Session recovery</h1></div><button class="right chip">Task actions ⋯</button></div><div class="toolbar"><span class="badge">In Progress</span><span class="muted">Run #2 · Started 16:52</span></div><div class="protocol"><div><section class="section"><h2>Request</h2><p>Restore a paused session with its latest checkpoint and preserve the task's run history.</p><p class="muted">Acceptance: the resumed run retains its context and exposes a clear recovery result.</p></section><section class="section"><h2>Current run</h2><div class="event"><small>16:58</small><div><b>Verification</b><p class="muted">Checking checkpoint continuity.</p></div></div><div class="event"><small>16:55</small><div><b>Changes prepared</b><p class="muted">Recovery state and protocol updated.</p></div></div><div class="event"><small>16:52</small><div><b>Run started</b><p class="muted">Assigned host accepted the task.</p></div></div></section></div><aside class="facts"><h2>Run context</h2><p><span class="muted">CLI</span><span>Codex</span></p><p><span class="muted">Spend so far</span><span class="num">$0.84</span></p><p><span class="muted">Source</span><span>Token ledger</span></p><div class="section"><h2>Evidence</h2><p>Recovery trace</p><p>Verification report</p><small>Illustrative links in this concept.</small></div></aside></div>`;
document.querySelector('#content').innerHTML=surface==='header'?'':`<div class="shell"><aside class="rail"><small>WORKSPACE</small><div class="selected">Demo App</div><div>Board</div><div>Tasks</div><div>Knowledge</div><small>PROJECT</small><div>Usage</div><div>Activity</div></aside><section class="workspace">${surface==='detail'?detail:board}</section></div>`;
document.querySelector('#provenance').textContent=`${stage==='before'?'Before reconstruction':'Proposed after'} · ${surface} · Synthetic fixture · 25 September 2026 · Not a live product capture`;
function openUsage(scope){
const dialog=document.querySelector('#usage');document.querySelector('#usage-title').textContent=scope==='Navigation'?'Workspace':scope==='Cost'?'Workspace cost':scope==='Usage'?'Workspace usage':scope+' usage';
const row=(a,b)=>`<div class="fact-row"><span>${a}</span><span>${b}</span></div>`;
document.querySelector('#sheet').innerHTML=scope==='Navigation'?'<p>Usage</p><p>Orchestrator</p><p>Feed</p><p>Settings</p><small>Navigation destinations are illustrative.</small>':`<small>Workspace: Demo App + Demo Platform · USD ledger estimates</small><h3>Quota windows</h3>${row('Codex · weekly used','15% · resets 28 Sep, 09:00')}${row('Codex · current 5 hours used','32% · resets today, 19:30')}${row('Claude · weekly / 5 hours used','7% / 19%')}${row('Claude · resets','29 Sep, 10:00 / today, 20:00')}<p><small>Europe/Berlin · UTC: Codex 28 Sep 07:00 / 25 Sep 17:30; Claude 29 Sep 08:00 / 25 Sep 18:00. Snapshot 16:58:00 local.</small></p><h3>Ledger cost</h3>${row('Today · 25 September','$12.48')}${row('This week · 21–27 September','$68.20')}${row('Demo App · today / week','$8.16 / $45.10')}${row('Demo Platform · today / week','$4.32 / $23.10')}<h3>Active runs · provisional spend</h3>${row('DEMO-104 · Codex','$0.84')}${row('DEMO-102 · Claude','$0.32')}${row('Total · already included above','$1.16')}<button class="chip slot">Slots · remote 2/3 · review 1/3 · auto 10/17</button><h3>Models in force</h3>${row('DEMO-104 · observed route','gpt-6-astra · medium')}${row('DEMO-102 · observed route','Claude Sonnet 5 · high')}<p><small>Illustrative run routes, not model recommendations. Read the routing policy before changing a route.</small></p><h3>Ledger access</h3><p><a href="index.html#data-contract">Open token ledger (concept contract)</a></p><small>Production implementation opens the existing ledger with this workspace and date range. Fixture reference time: 25 September 2026, 16:58 Europe/Berlin.</small>`;
dialog.showModal();}
if(params.has('expanded'))openUsage(params.get('expanded')||'Usage');
if(params.get('state')==='warning'){document.querySelectorAll('[data-cli="Codex"]').forEach(el=>{el.classList.add('warning');el.innerHTML=el.innerHTML.replace('15%','84%');el.setAttribute('aria-label','Codex weekly 84 percent used, quota warning. Open usage.');});}
if(params.get('state')==='limited'){document.querySelectorAll('[data-cli="Codex"]').forEach(el=>{el.classList.add('limited');el.innerHTML+=' !';el.setAttribute('aria-label','Codex provider limited. Last known weekly 15 percent used. Open usage.');});}
</script></body></html>
