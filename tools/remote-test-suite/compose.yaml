name: ${REMOTE_HARNESS_PROJECT:?REMOTE_HARNESS_PROJECT is required}

x-harness-labels: &harness-labels
  com.agentstudio.remote-harness.identity: ${REMOTE_HARNESS_PROJECT}
  com.agentstudio.remote-harness.run-id: ${REMOTE_HARNESS_RUN_ID}
  com.agentstudio.remote-harness.disposable: "true"

services:
  task-server:
    profiles: ["remote-integration"]
    image: ${REMOTE_HARNESS_PROJECT}-task-server:${REMOTE_HARNESS_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: tools/remote-test-suite/docker/task-server.Dockerfile
      args:
        HARNESS_REVISION: ${REMOTE_HARNESS_REVISION}
        HARNESS_IDENTITY: ${REMOTE_HARNESS_PROJECT}
    restart: "no"
    init: true
    ports:
      - "127.0.0.1:${REMOTE_HARNESS_TASK_SERVER_PORT}:5071"
    environment:
      LISTEN_URL: http://0.0.0.0:5071
      STORE_PATH: /var/lib/remote-harness/store
      BACKUP_PATH: /var/lib/remote-harness/backups
      AUTH: bearer
      AUTH_TOKEN: ${REMOTE_HARNESS_AUTH_TOKEN}
      AllowedHosts: "*"
      TaskServer__MinimumLeaseSeconds: "5"
      TaskServer__MaximumLeaseSeconds: "900"
      TaskServer__InvariantReconciliationSeconds: "5"
      TaskServer__ResultRefGcEnabled: "false"
    volumes:
      - task-server-data:/var/lib/remote-harness
    networks:
      - harness-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5071/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    labels: *harness-labels

  fault-proxy:
    profiles: ["remote-integration"]
    image: ${REMOTE_HARNESS_PROJECT}-fault-proxy:${REMOTE_HARNESS_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: tools/remote-test-suite/docker/node-harness.Dockerfile
      args:
        HARNESS_REVISION: ${REMOTE_HARNESS_REVISION}
        HARNESS_IDENTITY: ${REMOTE_HARNESS_PROJECT}
    restart: "no"
    init: true
    command: ["/harness/compose-fault-proxy.mjs"]
    depends_on:
      task-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REMOTE_HARNESS_FAULT_CONTROL_PORT}:8080"
    environment:
      FAULT_PROXY_TARGET_HOST: task-server
      FAULT_PROXY_TARGET_PORT: "5071"
      FAULT_PROXY_RUNNER_PORT: "6071"
      FAULT_PROXY_STUDIO_PORT: "7071"
      FAULT_PROXY_CONTROL_PORT: "8080"
    networks:
      - harness-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    labels: *harness-labels

  agent-runner:
    profiles: ["remote-integration"]
    image: ${REMOTE_HARNESS_PROJECT}-agent-runner:${REMOTE_HARNESS_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: tools/remote-test-suite/docker/agent-runner.Dockerfile
      args:
        HARNESS_REVISION: ${REMOTE_HARNESS_REVISION}
        HARNESS_IDENTITY: ${REMOTE_HARNESS_PROJECT}
      secrets: [sixlabors_license]
    restart: "no"
    init: true
    command: ["/harness/compose-agent.mjs"]
    depends_on:
      fault-proxy:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REMOTE_HARNESS_RUNNER_CONTROL_PORT}:8080"
    environment:
      REMOTE_HARNESS_SERVER_URL: http://fault-proxy:6071
      REMOTE_HARNESS_AUTH_TOKEN: ${REMOTE_HARNESS_AUTH_TOKEN}
      REMOTE_HARNESS_RUNNER_ID: ${REMOTE_HARNESS_PROJECT}-runner
      REMOTE_HARNESS_RUNNER_INSTANCE: ${REMOTE_HARNESS_PROJECT}-instance
      REMOTE_HARNESS_RUNNER_HOST: ${REMOTE_HARNESS_PROJECT}-host
      REMOTE_HARNESS_RUNNER_STATE: /var/lib/remote-harness-runner/claim.json
      REMOTE_HARNESS_RUNNER_TTL_SECONDS: "900"
      REMOTE_HARNESS_RUNNER_HEARTBEAT_MS: "1000"
      REMOTE_HARNESS_WORK_INTERVAL_MS: "10000"
      REMOTE_HARNESS_AUTHORITY_SAFETY_MARGIN_MS: "30000"
      REMOTE_HARNESS_MAX_SLOTS: "2"
      REMOTE_HARNESS_CONTROL_PORT: "8080"
    volumes:
      - runner-workspace:/var/lib/remote-harness-runner
    networks:
      - harness-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s
    stop_grace_period: 10s
    labels: *harness-labels

  studio:
    profiles: ["remote-integration"]
    image: ${REMOTE_HARNESS_PROJECT}-studio:${REMOTE_HARNESS_IMAGE_TAG}
    build:
      context: ../..
      dockerfile: tools/remote-test-suite/docker/studio.Dockerfile
      args:
        HARNESS_REVISION: ${REMOTE_HARNESS_REVISION}
        HARNESS_IDENTITY: ${REMOTE_HARNESS_PROJECT}
    restart: "no"
    depends_on:
      fault-proxy:
        condition: service_healthy
    ports:
      - "127.0.0.1:${REMOTE_HARNESS_STUDIO_PORT}:80"
    environment:
      REMOTE_HARNESS_TASK_SERVER_UPSTREAM: fault-proxy:7071
      REMOTE_HARNESS_AUTH_TOKEN: ${REMOTE_HARNESS_AUTH_TOKEN}
    networks:
      - harness-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 3s
    labels: *harness-labels

networks:
  harness-network:
    name: ${REMOTE_HARNESS_PROJECT}-network
    labels: *harness-labels

volumes:
  task-server-data:
    name: ${REMOTE_HARNESS_PROJECT}-task-server-data
    labels: *harness-labels
  runner-workspace:
    name: ${REMOTE_HARNESS_PROJECT}-runner-workspace
    labels: *harness-labels

# ImageSharp 3.2 fails Release builds without a Six Labors license key.
secrets:
  sixlabors_license:
    environment: SixLaborsLicenseKey
