services:
  agent-host-coding:
    env_file:
      - path: ./runner.env
        required: false

  agent-host-review:
    env_file:
      - path: ./runner.env
        required: false

  task-server:
    image: "${SCENARIO_TASK_SERVER_IMAGE:?set SCENARIO_TASK_SERVER_IMAGE}"
    build:
      context: .
      dockerfile: task-server/Dockerfile
      args:
        VERSION: ${SCENARIO_BUILD_VERSION:?set SCENARIO_BUILD_VERSION}
        SHA: ${SCENARIO_BUILD_SHA:?set SCENARIO_BUILD_SHA}
    environment:
      BOOTSTRAP_RUNNER_ID: scenario-coding-runner
      TaskServer__MinimumLeaseSeconds: "5"
      TaskServer__MaximumLeaseSeconds: "30"
    secrets:
      - source: studio_token
        target: /run/secrets/studio_token
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: engine_token
        target: /run/secrets/engine_token
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: runner_token
        target: /run/secrets/runner_token
        uid: "10001"
        gid: "10001"
        mode: 0400

  studio-bff:
    image: "${SCENARIO_STUDIO_BFF_IMAGE:?set SCENARIO_STUDIO_BFF_IMAGE}"
    build:
      context: .
      dockerfile: studio-bff/Dockerfile
      args:
        VERSION: ${SCENARIO_BUILD_VERSION:?set SCENARIO_BUILD_VERSION}
        SHA: ${SCENARIO_BUILD_SHA:?set SCENARIO_BUILD_SHA}

  agent-host-distributed:
    profiles: ["distributed", "runner"]
    image: "${SCENARIO_AGENT_HOST_IMAGE:?set SCENARIO_AGENT_HOST_IMAGE}"
    user: "${SCENARIO_UID:?set SCENARIO_UID}:${SCENARIO_GID:?set SCENARIO_GID}"
    build:
      context: .
      dockerfile: testsupport/scenario/runner.Dockerfile
    environment:
      HOME: /scenario/home
      DOTNET_CLI_HOME: /scenario/home
      RUNNER_ID: scenario-coding-runner
      RUNNER_NAME: scenario-coding-runner
      RUNNER_HOSTNAME: scenario-coding-host
      RUNNER_ROLE: coding
      RUNNER_GIT_REMOTE: /scenario/origin.git
      RUNNER_BASE_BRANCH: main
      RUNNER_BRANCH: main
      RUNNER_WORKDIR: /scenario/runner-work
      RUNNER_STATE_DIR: /scenario/runner-state
      RUNNER_CLI_BIN: /usr/local/bin/scenario-coding-agent
      RUNNER_AUTH_TOKEN_FILE: /scenario/runner.token
      RUNNER_EXEC_ENGINE: legacy
      RUNNER_CLI_ARGS: ""
      RUNNER_HEARTBEAT_SECONDS: "5"
      RUNNER_RUN_TIMEOUT_SECONDS: "45"
      RUNNER_TTL_SECONDS: "15"
      RUNNER_MAX_PARALLELISM: "1"
      RUNNER_POLL_SECONDS: "1"
      SCENARIO_RELEASE_FILE: /scenario/release
    volumes:
      - type: bind
        source: ${SCENARIO_HOST_DIR:?set SCENARIO_HOST_DIR}
        target: /scenario
    secrets:
      - source: runner_token
        target: /run/secrets/runner_token
        mode: 0400
