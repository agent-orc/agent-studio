name: agent-studio-website

services:
  api:
    image: ghcr.io/agent-orc/agent-studio-api:v${STUDIO_VERSION:?Run setup.sh with a release version}
    restart: ${STUDIO_RESTART_POLICY:-on-failure}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TaskRepository: /data/workspace
      HOME: /data/home
      Security__Profile: networked
      Security__PublicCloudflareEdge: ${STUDIO_PUBLIC_CLOUDFLARE_EDGE:?Set true for public or false for private installs}
      Security__BootstrapCode: ${STUDIO_BOOTSTRAP_CODE:?Run setup.sh}
      Security__TrustedProxyAddresses: 172.30.83.3,172.30.83.2
      AllowedHosts: ${STUDIO_DOMAIN:?Set STUDIO_DOMAIN}
      STUDIO_DOMAIN: ${STUDIO_DOMAIN}
    volumes:
      - ${STUDIO_DATA_DIR:?Run setup.sh}/workspace:/data/workspace
      - ${STUDIO_DATA_DIR}/projects:/data/projects
      - ${STUDIO_DATA_DIR}/home:/data/home
    networks:
      website:
        ipv4_address: 172.30.83.4

  frontend:
    image: ghcr.io/agent-orc/agent-studio-web:v${STUDIO_VERSION}
    restart: ${STUDIO_RESTART_POLICY:-on-failure}
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN}
    volumes:
      - ./Caddyfile.frontend:/etc/caddy/Caddyfile:ro
    depends_on:
      api: {condition: service_healthy}
    networks:
      website:
        ipv4_address: 172.30.83.3

  edge:
    image: caddy:2-alpine
    # Public stacks wait for the firewall boot unit; private stacks use Docker restart.
    restart: ${STUDIO_RESTART_POLICY:-on-failure}
    environment:
      STUDIO_DOMAIN: ${STUDIO_DOMAIN}
      # Caddyfile.cloudflare only: true admits peers outside Cloudflare's ranges.
      STUDIO_CLOUDFLARE_ALLOW_DIRECT: ${STUDIO_CLOUDFLARE_ALLOW_DIRECT:-false}
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    volumes:
      - ${STUDIO_CADDYFILE:-./Caddyfile.public}:/etc/caddy/Caddyfile:ro
      - ./cloudflare-ips.caddy:/etc/caddy/cloudflare-ips.caddy:ro
      - ${STUDIO_DATA_DIR}/origin-pull:/etc/caddy/origin-pull:ro
      - ${STUDIO_DATA_DIR}/caddy-data:/data
      - ${STUDIO_DATA_DIR}/caddy-config:/config
    depends_on:
      frontend: {condition: service_healthy}
    networks:
      website:
        ipv4_address: 172.30.83.2

networks:
  website:
    driver_opts:
      com.docker.network.bridge.name: br-studio-web
    ipam:
      config:
        - subnet: 172.30.83.0/24
