# CI-only override: build task-server and orchestrator-engine locally from
# this checkout instead of pulling published images, since the topology test
# runs before any image is published for the commit under test. Never used
# outside CI; production always pulls the published, versioned images named
# by compose.yaml. See scripts/control-plane-topology-test.sh and
# .github/workflows/control-plane-topology.yml.
services:
  task-server:
    build:
      context: ../../..
      dockerfile: task-server/Dockerfile
      args:
        VERSION: ${CONTROL_PLANE_BUILD_VERSION:?set CONTROL_PLANE_BUILD_VERSION}
        SHA: ${CONTROL_PLANE_BUILD_SHA:-unknown}

  orchestrator-engine:
    build:
      context: ../../..
      dockerfile: orchestrator-engine/Dockerfile
      args:
        VERSION: ${CONTROL_PLANE_BUILD_VERSION:?set CONTROL_PLANE_BUILD_VERSION}
        SHA: ${CONTROL_PLANE_BUILD_SHA:-unknown}

  backup:
    build:
      context: ../../..
      dockerfile: task-server/Dockerfile
      args:
        VERSION: ${CONTROL_PLANE_BUILD_VERSION:?set CONTROL_PLANE_BUILD_VERSION}
        SHA: ${CONTROL_PLANE_BUILD_SHA:-unknown}
