[Unit]
# Review replacement must pass through agent-runner-deploy so busy slots are
# drained or explicitly handed off. Direct stop and restart requests bypass
# that policy, so systemd refuses them for the Review unit only.
RefuseManualStop=true

[Service]
# A successful daemon drain is a deliberate stop. Unexpected failures still
# restart; guarded replacement explicitly starts the next generation.
Restart=on-failure
