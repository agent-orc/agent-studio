[Service]
# A planned daemon restart must not terminate detached coding or review workers.
KillSignal=SIGTERM
KillMode=process
# ...and it must not take their /tmp away either. PrivateTmp is lifecycle-bound:
# the restart unmounts the unit's private /tmp while the detached workers keep
# the deleted mount, after which MSBuild fails with MSB1025 on its node pipe and
# NuGet fails with mkdtemp ENOENT on its migrations mutex. Applied here as well
# as in the shipped units so hosts installed before AGT-2750 pick it up without
# being re-onboarded.
PrivateTmp=false
