[Service]
# A planned daemon restart must not terminate detached coding or review workers.
KillSignal=SIGTERM
KillMode=process
# PrivateTmp=true tore the private /tmp mount away from a still-running
# detached worker on every restart (MSB1025, SocketException (99), NuGet
# mkdtemp ENOENT). Overrides the base unit's PrivateTmp=true.
PrivateTmp=false
