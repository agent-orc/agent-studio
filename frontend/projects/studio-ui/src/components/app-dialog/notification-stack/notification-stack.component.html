<ng-template #toasts let-items>
  @for (n of items; track n.id) {
    <app-notification
      class="app-notify"
      [kind]="n.kind"
      layout="toast"
      [title]="n.title ?? null"
      [closable]="true"
      [testid]="'notification-' + n.kind"
      (closeRequest)="dismiss(n.id)">
      <span data-testid="notification-message">{{ n.message }}</span>
      @if (n.details && n.details.length > 0) {
        <ul class="app-notify__details" data-testid="notification-details">
          @for (d of n.details; track d) {
            <li>{{ d }}</li>
          }
        </ul>
      }
      @if (n.source) {
        <div class="app-notify__source" notification-source data-testid="notification-source">{{ n.source }}</div>
      }
      @if (n.actions && n.actions.length > 0) {
        <div class="app-notify__actions" notification-actions data-testid="notification-actions">
          @for (a of n.actions; track a.label) {
            <button type="button"
                    class="app-notify__btn"
                    [class.app-notify__btn--primary]="a.primary"
                    [attr.data-testid]="a.testId ?? null"
                    (click)="onAction(a, n.id); $event.stopPropagation()">{{ a.label }}</button>
          }
        </div>
      }
    </app-notification>
  }
</ng-template>

<div class="app-notify-stack" data-testid="notification-stack">
  <ng-container [ngTemplateOutlet]="toasts" [ngTemplateOutletContext]="{ $implicit: topRight() }"></ng-container>
</div>

<div class="app-notify-stack app-notify-stack--bottom-right" data-testid="notification-stack-bottom-right">
  <ng-container [ngTemplateOutlet]="toasts" [ngTemplateOutletContext]="{ $implicit: bottomRight() }"></ng-container>
</div>

<div class="app-notify-stack app-notify-stack--below-toolbar" data-testid="notification-stack-below-toolbar"
     [style.top.px]="belowToolbarTop()"
     [style.--notify-dock-top]="(belowToolbarTop() ?? 96) + 'px'">
  <ng-container [ngTemplateOutlet]="toasts" [ngTemplateOutletContext]="{ $implicit: belowToolbar() }"></ng-container>
</div>
