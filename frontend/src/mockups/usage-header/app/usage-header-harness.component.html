<div class="harness" [style.width.px]="container" data-testid="harness-frame">
  <app-usage-cockpit-header data-testid="studio-titlebar"
                            [snapshot]="snapshot"
                            [selectedCliId]="selected()"
                            [defaultCliId]="defaultCli"
                            [navItems]="navItems"
                            [now]="now"
                            [openDetail]="openDetail()"
                            (navSelect)="onNav($event)"
                            (usageSelect)="onUsage($event)">
    <span class="nav-crumb" data-nav-inline-from="desktop">Demo workspace</span>
    <span class="nav-sep" data-nav-inline-from="desktop">/</span>
    <button type="button" class="nav-control" data-testid="nav-project" data-nav-inline-from="tablet"
            (click)="onNav('project')">Demo App ▾</button>
    <span class="nav-spacer"></span>
    <button type="button" class="nav-control" data-testid="nav-search" data-nav-inline-from="tablet"
            (click)="onNav('search')">Search<span data-nav-inline-from="desktop">&nbsp;tasks, dossiers, files</span></button>
    <button type="button" class="nav-control" data-testid="nav-chat" data-nav-inline-from="tablet"
            (click)="onNav('chat')">Project Chat</button>
    <button type="button" class="nav-control" data-testid="nav-theme" data-nav-inline-from="desktop"
            (click)="onNav('theme')">Theme</button>
  </app-usage-cockpit-header>
  <output class="harness__action" data-testid="harness-last-action">{{ lastAction() }}</output>
</div>
