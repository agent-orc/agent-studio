<div class="secret" role="status" [attr.data-testid]="testId()">
  <p class="secret__eyebrow">Shown once</p>
  <p class="secret__title">{{ title() }}</p>
  @if (note(); as text) { <p class="secret__note">{{ text }}</p> }
  <code class="secret__value" [attr.data-testid]="testId() + '-value'">{{ value() }}</code>
  <ng-content />
  <div class="secret__actions">
    <button type="button" class="btn btn--primary" [attr.data-testid]="testId() + '-copy'" (click)="copy()">{{ copied() ? 'Copied' : copyLabel() }}</button>
    <button type="button" class="btn btn--ghost" [attr.data-testid]="testId() + '-done'" (click)="dismissed.emit()">Done</button>
  </div>
  @if (copyFailed()) { <p class="secret__note" role="alert">Copy failed. Select the value above and copy it.</p> }
</div>
