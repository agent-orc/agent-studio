@if (state(); as confirm) {
  <app-dialog [eyebrow]="confirm.eyebrow ?? (confirm.kind === 'danger' ? 'Confirm delete' : 'Please confirm')"
              [title]="confirm.title"
              role="alertdialog"
              [kind]="confirm.kind === 'danger' ? 'danger' : 'primary'"
              size="sm"
              testid="confirm-dialog"
              (closeRequest)="onCancel()"
              (backdropClick)="onBackdropClick()"
              (keydown)="onPanelKeydown($event)">
    <p class="app-dialog__message" data-testid="confirm-dialog-message">{{ confirm.message }}</p>
    @if (confirm.detail) {
      <p class="app-dialog__detail" data-testid="confirm-dialog-detail">{{ confirm.detail }}</p>
    }
    @if (confirm.items; as items) {
      <ul class="app-dialog__items" data-testid="confirm-dialog-items" tabindex="0"
          [attr.aria-label]="items.length + ' items'" (keydown)="containListKeys($event)">
        @for (item of items; track $index) { <li data-testid="confirm-dialog-item">{{ item }}</li> }
      </ul>
    }
    @if (confirm.requireTypedValues) {
      <label class="app-dialog__typed">
        @if (confirm.requireTypedPrompt) {
          <span class="app-dialog__typed-label"
                data-testid="confirm-dialog-typed-prompt">{{ confirm.requireTypedPrompt }}</span>
        }
        <input #typedInput
               type="text"
               class="app-dialog__typed-input"
               autocomplete="off"
               autocapitalize="off"
               spellcheck="false"
               data-testid="confirm-dialog-typed-input"
               [value]="typedDraft()"
               (input)="typedDraft.set($any($event.target).value)" />
      </label>
    }
    @if (confirm.requireReason; as gate) {
      <label class="app-dialog__typed">
        <span class="app-dialog__typed-label"
              data-testid="confirm-dialog-reason-prompt">{{ gate.prompt }}</span>
        <textarea #reasonInput
                  class="app-dialog__typed-input app-dialog__typed-input--prose"
                  rows="3"
                  data-testid="confirm-dialog-reason-input"
                  aria-describedby="confirm-dialog-reason-hint"
                  [value]="reasonDraft()"
                  (input)="reasonDraft.set($any($event.target).value)"></textarea>
        <span class="app-dialog__typed-label" id="confirm-dialog-reason-hint"
              data-testid="confirm-dialog-reason-hint">At least {{ gate.minLength }} characters.</span>
      </label>
    }
    <div footer>
      <button class="btn btn--ghost"
              type="button"
              data-testid="confirm-dialog-cancel"
              (click)="onCancel()">{{ confirm.cancelLabel }}</button>
      <button #confirmBtn
              class="btn"
              [class.btn--danger]="confirm.kind === 'danger'"
              [class.btn--primary]="confirm.kind === 'primary'"
              type="button"
              [disabled]="!canConfirm()"
              data-testid="confirm-dialog-confirm"
              (click)="onAccept()">{{ confirm.confirmLabel }}</button>
    </div>
  </app-dialog>
}
