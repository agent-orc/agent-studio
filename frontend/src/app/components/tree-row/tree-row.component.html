<button type="button"
        class="tree-row"
        [class.tree-row--active]="active()"
        [class.tree-row--root]="level() === 'root'"
        [class.tree-row--child]="level() === 'child'"
        [attr.data-testid]="testid()"
        [disabled]="disabled()"
        [attr.aria-label]="ariaLabel()"
        [attr.aria-controls]="ariaControls()"
        [attr.aria-current]="ariaCurrent()"
        [attr.aria-expanded]="chevron() === null ? null : (chevron() === 'expanded')"
        [appTooltip]="tooltip()"
        [appTooltipTestId]="tooltipTestId()"
        (click)="onSelect($event)"
        (dblclick)="onSecondary($event)">
  @if (chevron(); as c) {
    <span class="tree-row__chev"
          [attr.data-testid]="chevronTestid()"
          [attr.aria-label]="c === 'expanded' ? 'Collapse' : 'Expand'"
          (click)="onChevronClick($event)" tabindex="0" (keydown.enter)="onChevronClick($event)" (keydown.space)="onChevronClick($event); $event.preventDefault()">
      <app-studio-icon [name]="c === 'expanded' ? 'chevronDown' : 'chevronRight'" [size]="10"></app-studio-icon>
    </span>
  } @else if (reserveChevron()) {
    <span class="tree-row__chev tree-row__chev--placeholder" aria-hidden="true"></span>
  }
  @if (glyph(); as g) {
    <span class="tree-row__glyph-icon" aria-hidden="true"
          [attr.data-testid]="testid() ? testid() + '-glyph' : null">
      <app-studio-icon [name]="g" [size]="12"></app-studio-icon>
    </span>
  } @else if (glyphChar(); as gc) {
    <span class="tree-row__glyph"
          [style.background]="glyphColor()">
      <span aria-hidden="true">{{ gc }}</span>
      <span class="tree-row__glyph-overlay"
            [attr.data-testid]="testid() ? testid() + '-glyph-overlay' : null">
        <ng-content select="[glyphOverlay]"></ng-content>
      </span>
    </span>
  } @else if (reserveGlyph()) {
    <span class="tree-row__glyph-icon tree-row__glyph-icon--placeholder" aria-hidden="true"></span>
  }
  <span class="tree-row__name"
        [attr.data-testid]="testid() ? testid() + '-name' : null">{{ label() }}</span>
  <ng-content></ng-content>
  @if (meta(); as m) {
    <span class="tree-row__meta">{{ m }}</span>
  }
  @if (count() !== null) {
    <app-count-badge [value]="count()" [tone]="active() ? 'active' : 'default'" />
  }
</button>
