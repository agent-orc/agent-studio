<div class="md-editor"
     [class.md-editor--dirty]="state() === 'dirty'"
     [class.md-editor--saved]="state() === 'saved'"
     [class.md-editor--readonly]="readOnly()"
     [class.md-editor--drag]="isDragging()"
     [attr.data-state]="state()"
     data-testid="prompt-editor"
     (dragover)="onDragOver($event)"
     (dragleave)="onDragLeave($event)"
     (drop)="onDrop($event)">
  @if (readOnly()) {
    <div class="md-editor__lock" data-testid="prompt-editor-lock">
      <app-status-indicator tone="info"
                            [label]="lockReason()"
                            [detail]="lockReason()"
                            testId="prompt-editor-lock-state" />
    </div>
  }
  <!--
    Single-row toolbar: a `bar-prefix` ng-content slot carries any
    host-provided meta strip (e.g. the prompt pane's "#id · created Xh
    ago · lane") on the left, action icons sit on the right. The
    Markdown ↔ rich-text mode toggle is hidden behind the overflow
    button so the visible chrome stays calm. -->
  <div class="md-editor__bar md-editor__bar--compact">
    <div class="md-editor__bar-start">
      <ng-content select="[bar-prefix]"></ng-content>
    </div>
    <div class="md-editor__bar-end">
      @if (canAttach()) {
        <button class="md-editor__icon-btn"
                type="button"
                [disabled]="readOnly() || uploading()"
                (click)="triggerFilePicker()"
                data-testid="prompt-editor-attach"
                [attr.aria-label]="uploading() ? 'Uploading image' : 'Insert image'"
                [cacTooltip]="uploading() ? 'Uploading…' : 'Insert image (Ctrl+V also works)'">
          {{ uploading() ? '⏳' : '📎' }}
        </button>
      }
      <span class="md-editor__status" data-testid="prompt-editor-status">
        <app-status-indicator [tone]="saveState().tone"
                              [label]="saveState().label"
                              [compact]="true"
                              testId="prompt-editor-save-state" />
        <button class="md-editor__icon-btn"
                (click)="emitSave()"
                [disabled]="readOnly()"
                data-testid="prompt-editor-save"
                aria-label="Save (Ctrl+S)"
                [cacTooltip]="'Save (Ctrl+S)'">💾</button>
      </span>
      <button #modeMenuTrigger
              class="md-editor__icon-btn"
              type="button"
              data-testid="prompt-editor-mode-toggle"
              aria-label="View options"
              [attr.aria-expanded]="modeMenuOpen()"
              [cacTooltip]="'View options'"
              (click)="toggleModeMenu()">…</button>
    </div>
  </div>

  <app-menu [items]="modeMenuItems()"
            [open]="modeMenuOpen()"
            [anchorEl]="modeMenuTrigger"
            placement="below"
            testIdPrefix="prompt-editor-mode-menu"
            ariaLabel="View as"
            (itemClick)="onModeMenuClick($event)"
            (closeRequest)="modeMenuOpen.set(false)" />

  <div class="md-editor__content">
    <div #editorHost class="md-editor__rich" [class.md-editor__rich--hidden]="mode() !== 'rich'"></div>
    @if (mode() === 'source') {
      <textarea class="md-editor__source"
                data-testid="prompt-editor-source"
                [ngModel]="sourceValue()"
                (ngModelChange)="updateSource($event)"
                (keydown)="handleKeydown($event)"
                (paste)="handleSourcePaste($event)"
                [readonly]="readOnly()"></textarea>
    }
  </div>

  @if (uploadError()) {
    <div class="md-editor__error" data-testid="prompt-editor-upload-error">
      <app-status-indicator tone="danger"
                            [label]="uploadError() ?? ''"
                            [detail]="uploadError()"
                            testId="prompt-editor-upload-error-state" />
    </div>
  }

  <input #fileInput
         type="file"
         accept="image/png,image/jpeg,image/gif,image/webp"
         class="md-editor__file"
         (change)="onFileInputChange($event)" />
</div>
