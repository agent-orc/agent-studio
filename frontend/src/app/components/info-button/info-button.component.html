<button type="button"
        class="info-btn"
        [attr.data-testid]="'info-button-' + topic()"
        [attr.aria-expanded]="open()"
        [attr.aria-label]="label()"
        [cacTooltip]="label()"
        (click)="toggle($event)">i</button>
@if (open()) {
  <app-dialog
    [eyebrow]="eyebrow()"
    [title]="title()"
    role="dialog"
    widthTier="lg"
    [portalToBody]="true"
    [testid]="'info-button-modal-' + topic()"
    (closeRequest)="close()"
    (backdropClick)="close()">
    <div class="info-btn__body"
         [attr.data-testid]="'info-button-body-' + topic()">
      @if (loading()) {
        <p class="info-btn__loading">Loading…</p>
      } @else if (errorMessage(); as msg) {
        <p class="info-btn__error">{{ msg }}</p>
      } @else if (body(); as md) {
        @defer (on immediate) {
        <app-info-button-markdown-body [source]="md" />
        }
      }
    </div>
  </app-dialog>
}
