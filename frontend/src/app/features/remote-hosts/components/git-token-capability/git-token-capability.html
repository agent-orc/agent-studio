@if (mode() === 'badges') {
  <app-status-indicator [tone]="contents().tone" [label]="contents().label" testId="remote-host-git-status"
    [detail]="detail() || 'No successful push probe has been reported'" />
  <app-status-indicator [tone]="workflow().tone" [label]="workflow().label" testId="remote-host-workflow-status"
    [detail]="detail() || 'No workflow push probe has been reported'" />
} @else if (status() === 'ready-no-workflow-scope') {
  <p class="token-warning" data-testid="remote-host-token-scope-fix">
    Contents pushes work, but this runner cannot publish changes under <code>.github/workflows</code>.
    Grant the token's workflow write permission, update both credential URL forms, and restart the runner.
    <a href="https://github.com/agent-orc/agent-studio/blob/main/docs/operations/setup/linux-runner-host.md#token-requirements"
       target="_blank" rel="noopener noreferrer">Open token requirements</a>.
  </p>
}
