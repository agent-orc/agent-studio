<nav #list class="host-list" aria-label="Machines and roles" tabindex="0" (keydown)="onKeydown($event)" data-testid="remote-hosts-table">
  @for (group of groups(); track group.id) {
    <button class="host-list__row host-list__row--machine" type="button" [attr.data-host-row]="group.id"
      [attr.data-status]="group.machine.status"
      [attr.aria-current]="selected() === group.id ? 'true' : null" data-testid="remote-host-primary-row"
      (click)="selectedChange.emit(group.id)">
      <span class="host-list__dot" [attr.data-status]="group.machine.status" aria-hidden="true"></span>
      <strong data-testid="remote-host-name">{{ group.name }}</strong>
      @if (group.machine.releaseDrift?.state === 'behind') { <span title="Behind Stable">Update due</span> }
      @if (group.machine.stats; as stats) { <span>{{ stats.cpuLoadPct }}%</span> }
      <span class="host-list__slots" data-testid="remote-host-machine-slots">{{ groupSlots(group) }} / {{ groupCapacity(group) ?? 'Unknown' }}</span>
    </button>
    @for (role of group.roles; track role.id) {
      <button class="host-list__row host-list__row--role" type="button" [attr.data-host-row]="role.id"
        [attr.data-status]="role.status"
        [attr.aria-current]="selected() === role.id ? 'true' : null" data-testid="remote-host-role-row"
        (click)="selectedChange.emit(role.id)">
        <span class="host-list__dot" [attr.data-status]="role.status" aria-hidden="true"></span>
        <span data-testid="remote-host-role-label">{{ role.serviceRole === 'coding' ? 'Coding' : role.serviceRole === 'review' ? 'Review' : 'Runner' }} · <span data-testid="remote-host-role-name">{{ role.name }}</span></span>
        <span class="host-list__slots" data-testid="remote-host-slots-summary">{{ slots()(role) }} / {{ capacity(role) ?? 'Unknown' }}</span>
      </button>
    }
    @for (gate of gates(); track gate.id) {
      @if (gate.name === group.name) {
        <button class="host-list__row host-list__row--role" type="button" [attr.data-host-row]="'gate:' + gate.id"
          [attr.aria-current]="selected() === 'gate:' + gate.id ? 'true' : null" (click)="selectedChange.emit('gate:' + gate.id)">
          <span class="host-list__dot" data-status="online" aria-hidden="true"></span>
          <span>Gate worker</span><span class="host-list__slots">{{ gate.busy }} / {{ gate.slots }}</span>
        </button>
      }
    }
  }
  @for (gate of gates(); track gate.id) {
    @if (!hasGroup(gate.name)) {
    <button class="host-list__row host-list__row--machine" type="button" [attr.data-host-row]="'gate:' + gate.id"
      [attr.aria-current]="selected() === 'gate:' + gate.id ? 'true' : null" (click)="selectedChange.emit('gate:' + gate.id)">
      <span class="host-list__dot" data-status="online" aria-hidden="true"></span>
      <strong>{{ gate.name }}</strong><span>Gate worker</span>
      <span class="host-list__slots">{{ gate.busy }} / {{ gate.slots }}</span>
    </button>
    }
  }
</nav>
