@if (alerts().length) {
  <section class="credential-alerts" [class.credential-alerts--compact]="compact()" data-testid="credential-alerts" aria-label="Credential alerts">
    <button type="button" class="credential-alerts__link" (click)="openInventory()">
      <app-status-indicator tone="warning" [label]="'Credentials · ' + alerts().length + ' need attention'" [compact]="true"
                            testId="credential-alerts-state" />
    </button>
    @if (!compact()) {
      <ul>
        @for (item of alerts(); track item.id) {
          <li>{{ item.hostId }}: {{ item.label }} · {{ item.detail }}
            @if (item.affectedCards.length) { · Cards {{ item.affectedCards.join(', ') }} }
          </li>
        }
      </ul>
    }
  </section>
}
