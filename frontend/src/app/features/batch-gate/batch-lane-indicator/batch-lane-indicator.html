@for (project of projects(); track project) {
  @if (stateFor(project); as batch) {
    @if (batch.plan.decision !== 'disabled' || batch.perTaskGates?.length) {
      @let alert = alertFor(project);
      <button type="button" class="batch-lane-indicator" data-testid="batch-lane-indicator" (click)="panelProject.set(project)"
        [attr.data-batch-alert]="alert?.state ?? null" [attr.data-batch-id]="alert?.batchId ?? null"
        [attr.title]="alert ? alertTitle(alert) : null">
        @if (alert) {
          <span class="batch-lane-indicator__alert" data-testid="batch-lane-alert-line">
            <app-status-indicator [tone]="alert.state === 'red' ? 'danger' : 'running'" [label]="alertLabel(alert)"
              [compact]="true" [wrap]="true" testId="batch-lane-alert" />
            @if (alert.culprits.length) { <span data-testid="batch-lane-culprits">{{ alert.culprits.join(', ') }} proven red</span> }
            <span data-testid="batch-lane-held">{{ heldLabel(alert) }}</span>
          </span>
        }
        <span class="batch-lane-indicator__summary" data-testid="batch-lane-summary">
          @if (projects().length > 1) { {{ project }} · }
          @if (batch.plan.decision !== 'disabled') {
            Batch: {{ waitingFor(project) }} waiting · @if (batch.plan.closeAtUtc) { ~{{ batch.plan.closeAtUtc | date:'HH:mm':'UTC' }} UTC } @else { when ready } · {{ runningFor(project) }} running
          }
          @if (batch.perTaskGates?.length) { @if (batch.plan.decision !== 'disabled') { · } Per-task gates: {{ perTaskFor(project).queued }} queued · {{ perTaskFor(project).running }} running }
        </span>
      </button>
    }
  }
}
@if (panelProject(); as project) {
  @defer (on immediate) {
    <app-batch-panel [project]="project" [closed]="closePanel" />
  }
}
