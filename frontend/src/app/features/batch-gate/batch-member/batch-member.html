@if (badge(); as view) {
  <app-status-indicator data-testid="batch-member-badge" [attr.data-status]="view.status"
    [attr.data-reason]="view.reason" [attr.title]="view.title"
    [tone]="view.tone" [label]="view.label" [compact]="true" testId="batch-member-status" />
}
@if (pushWait(); as wait) {
  <app-status-indicator data-testid="task-card-integration-push-wait" role="status"
    [attr.title]="wait.reason" tone="warning" [compact]="true" testId="batch-member-push-wait-status"
    [label]="'Awaiting approved origin push · ' + wait.ageMinutes.toFixed(1) + ' min'" />
}
