@if (member(); as item) {
  <span data-testid="batch-member-badge" [attr.data-status]="item.status"
    [attr.data-reason]="item.reason ?? null" [attr.data-red]="redReason() ? 'true' : null"
    [attr.title]="redReason() ?? item.preCheck?.reason ?? item.waitingFor ?? item.reasonDetail ?? ejection()">
    <app-status-indicator [tone]="redReason() ? 'danger' : memberTone(item.status)"
      [label]="memberLabel(item)" [compact]="true" [wrap]="true" />
  </span>
  @if (item.status === 'fallback' && (item.fallbackEvent || item.reasonDetail)) {
    <span class="batch-member__event" data-testid="batch-member-event">
      {{ item.fallbackEvent || item.reasonDetail }}
      <span class="batch-member__outcome">Red escalates; green integrates.</span>
    </span>
  }
}
@if (pushWait(); as wait) {
  <span data-testid="task-card-integration-push-wait" role="status" [attr.title]="wait.reason">
    <app-status-indicator tone="warning" [label]="'Awaiting approved origin push · ' + wait.ageMinutes.toFixed(1) + ' min'" [compact]="true" />
  </span>
}
