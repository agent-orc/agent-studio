@let v = view();
<button type="button"
        class="usage-cli-chip"
        [class.usage-cli-chip--warning]="v.alarm === 'warning'"
        [class.usage-cli-chip--limited]="v.alarm === 'limited'"
        [attr.data-testid]="'usage-cli-chip-' + v.cliId"
        [attr.data-state]="v.state"
        [attr.data-fit]="fit()"
        [attr.data-alarm]="v.alarm"
        [attr.data-usage-trigger]="controls() ? 'cli:' + v.cliId.toLowerCase() : null"
        aria-haspopup="dialog"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="controls()"
        [attr.aria-label]="v.ariaLabel"
        [cacTooltip]="v.detail"
        (click)="activate.emit(v.cliId)">
  <span class="usage-cli-chip__body">
    <span class="usage-cli-chip__name">{{ visibleName() }}</span>
    @if (v.state === 'loading') {
      <span class="usage-cli-chip__placeholder" aria-hidden="true"></span>
    } @else if (v.state === 'unknown') {
      <span class="usage-cli-chip__value usage-cli-chip__value--muted" data-testid="usage-cli-chip-unavailable">{{ v.stateLabel }}</span>
    } @else {
      @for (w of windows(); track w.kind) {
        <span class="usage-cli-chip__window" [attr.data-window]="w.kind">
          @if (fit() !== 'bare') {
            <span class="usage-cli-chip__tag">{{ w.tag }}</span>
          }
          <span class="usage-cli-chip__value"
                [class.usage-cli-chip__value--muted]="!w.reported || v.state !== 'normal'"
                [attr.data-testid]="'usage-cli-chip-' + v.cliId + '-' + w.kind">{{ w.value }}</span>
        </span>
      }
    }
    @if (v.alarmLabel && !compact()) {
      <span class="usage-cli-chip__alarm" data-testid="usage-cli-chip-alarm-label">{{ v.alarmLabel }}</span>
    } @else if (v.alarm) {
      <span class="usage-cli-chip__mark usage-cli-chip__mark--alarm" data-testid="usage-cli-chip-alarm-mark" aria-hidden="true"><app-studio-icon name="warn" [size]="14" /></span>
    } @else if (v.state === 'stale') {
      <span class="usage-cli-chip__mark" aria-hidden="true"><app-studio-icon name="clock" [size]="14" /></span>
    } @else if (v.state === 'suspicious') {
      <span class="usage-cli-chip__mark" aria-hidden="true"><app-studio-icon name="help" [size]="14" /></span>
    }
    @if (v.hiddenAlarm) {
      <span class="usage-cli-chip__hidden"
            [attr.data-severity]="v.hiddenAlarm"
            data-testid="usage-hidden-alarm"
            aria-hidden="true"><app-studio-icon name="warn" [size]="14" /></span>
    }
  </span>
</button>
