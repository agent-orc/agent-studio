<div class="usage-cockpit-host" data-testid="usage-cockpit-host">
  @if (workspaceQuota(); as quota) {
    @if (quota.status !== 'ok' && !quota.overrideActive) {
      <span class="usage-cockpit-host__quota" role="status" data-testid="workspace-quota-status"
            [attr.data-status]="quota.status">{{ quota.message }}</span>
    }
  }
  <div class="usage-cockpit-host__primary">
    <app-usage-cli-chip [cliId]="primaryCliId()" [cli]="primaryCli()" [timeZone]="snapshot()?.timeZone ?? null"
      [alarms]="primaryAlarms()" [hiddenAlarms]="hiddenAlarms()" [readFailed]="readFailed()" [compact]="phone()" (activate)="openUsage.emit()" />
    <app-usage-cost-chip [cost]="snapshot()?.cost ?? null" [alarms]="costAlarms()" [readFailed]="readFailed()" [compact]="phone()" (activate)="openUsage.emit()" />
  </div>
  @if (secondaryVisible()) { <div class="usage-cockpit-host__secondary">
    @for (cli of secondaryClis(); track cli.cliId) {
      <app-usage-cli-chip [cliId]="cli.cliId" [cli]="cli" [timeZone]="snapshot()?.timeZone ?? null"
        [alarms]="secondaryAlarms(cli.cliId)" [readFailed]="readFailed()" (activate)="openUsage.emit()" />
    }
  </div> }
  <app-usage-alarm-status />
</div>
