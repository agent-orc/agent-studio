<div class="cockpit-header__nav" data-testid="cockpit-header-nav-row">
  <span class="cockpit-header__wordmark">Studio</span>
  <div class="cockpit-header__nav-content"><ng-content /></div>
  <div class="cockpit-header__more">
    <button #moreTrigger type="button" class="cockpit-header__more-trigger"
            data-testid="cockpit-header-more" aria-label="More navigation"
            aria-haspopup="menu" [attr.aria-expanded]="moreOpen()"
            (click)="onMoreClick($event)">⋯</button>
    <app-menu [items]="menuItems()" [open]="moreOpen()" [anchorEl]="moreTrigger"
              placement="below" testIdPrefix="cockpit-header-more-menu" ariaLabel="More navigation"
              [minWidth]="200" (itemClick)="onMenuItem($event)" (closeRequest)="closeMore()" />
  </div>
  <ng-content select=".studio-titlebar__actions" />
</div>
