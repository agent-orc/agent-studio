<span
  class="review-tag"
  [attr.data-verdict]="review()?.verdict ?? 'never-reviewed'"
  [appTooltip]="tooltip()"
  [appTooltipDelay]="0"
  [appTooltipLinks]="links()"
  appTooltipTestId="workbench-review-tooltip"
  tabindex="0"
  data-testid="workbench-review-tag"
>
  <app-status-indicator [tone]="tone()" [label]="reviewDue() ? 'Review due · ' + label() : label()" [compact]="true"
                        testId="workbench-review-state" />
</span>
