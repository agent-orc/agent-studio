<section class="deploy-overview" data-testid="deploy-environments" aria-labelledby="deploy-environments-title">
  <header class="deploy-overview__head">
    <h2 id="deploy-environments-title">Environments</h2>
    <p>Each card shows what runs there now and how its last deploy ended.</p>
  </header>
  @switch (panel().status) {
    @case ('loading') { <app-loading-surface kind="list" label="Loading environments…" /> }
    @case ('error') {
      <app-empty-state icon="warn" title="Environments could not be loaded" [body]="errorBody()" testid="deploy-environments-error" />
    }
    @default {
      @if (cards().length) {
        <div class="deploy-overview__grid">
          @for (card of cards(); track card.id) {
            <app-deploy-environment-card [environment]="card" [now]="now()"
              (openRun)="openRun.emit($event)" (openTools)="openTools.emit()" />
          }
        </div>
      } @else {
        <app-empty-state icon="layout" title="No environments declared" testid="deploy-environments-empty"
          body="Add one JSON file per environment under docs/deployments/environments/ in the project repository. Each names its kind (stage or production), target host, address, and health URL. Staging and Production then appear here." />
      }
    }
  }
</section>
