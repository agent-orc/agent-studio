@if (gaps(); as gaps) {
  <section class="secret-gaps" role="status" [attr.data-testid]="'deploy-secret-gaps-' + gaps.environmentId">
    <p class="secret-gaps__head"><strong>{{ heading() }}</strong></p>
    <ul class="secret-gaps__list">
      @for (item of gaps.missing; track item.name) {
        <li><code>{{ item.name }}</code> <span class="secret-gaps__reason">{{ reason(item) }}</span></li>
      }
    </ul>
    <button type="button" [attr.data-testid]="'deploy-secret-bind-' + gaps.environmentId"
            [attr.aria-label]="'Bind secrets for ' + gaps.environmentName" (click)="bind.emit(gaps.environmentId)">Bind secrets</button>
  </section>
}
