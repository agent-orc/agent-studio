<dialog #dlg
        class="log-overlay"
        data-testid="log-overlay"
        aria-label="Agent log"
        [appTaskArtifactLinks]="artifactLinkContext()"
        (close)="closeRequest.emit()"
        (click)="onBackdropClick($event)"
        tabindex="0"
        (keydown.enter)="onBackdropClick($event)"
        (keydown.space)="onBackdropClick($event); $event.preventDefault()">
  <div class="log-overlay__panel" (click)="$event.stopPropagation()" tabindex="0" (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation(); $event.preventDefault()">
    <div class="log-overlay__header">
      <div>
        <h3 class="log-overlay__title">Agent log</h3>
      </div>
      <button class="btn-sm" data-testid="log-overlay-close" (click)="dismiss()">✕ Close</button>
    </div>

    <div class="log-overlay__content">
      <section class="sidebar-card">
        <div class="sidebar-card__header">
          <h3 class="section__title">Activity log</h3>
        </div>
        <app-activity-log-view [lines]="cliOutput()"
                               [bodyMaxHeight]="'none'"
                               [isRunning]="isRunning()"
                               variant="embedded" />
      </section>

      <section class="sidebar-card">
        <div class="sidebar-card__header">
          <h3 class="section__title">Protocol</h3>
          @if (log().length > 0) {
            <button class="btn-sm"
                    data-testid="log-overlay-copy-protocol"
                    [cacTooltip]="'Copy the protocol entries to the clipboard'"
                    (click)="copyProtocol()">{{ copyLabel() }}</button>
          }
        </div>
        @if (log().length > 0) {
          <div class="log log--overlay">
            @for (entry of log(); track entry.timestamp) {
              <div class="log__row" data-testid="protocol-log-row">
                <span class="log__time" data-testid="protocol-log-time">{{ formatTime(entry.timestamp) }}</span>
                <span class="log__event">{{ entry.event }}</span>
                @if (entry.detail) {
                  <span class="log__detail">{{ entry.detail }}</span>
                }
              </div>
            }
          </div>
        } @else {
          <div class="sidebar-card__empty">No protocol entries yet.</div>
        }
      </section>
    </div>
  </div>
</dialog>
