<div class="results-view"
     data-testid="beautiful-results">

  @if (banner(); as b) {
    <div class="results-banner"
         [attr.data-kind]="b.kind"
         data-testid="results-sentinel-banner"
         role="status">
      <span class="results-banner__icon" aria-hidden="true">{{ b.icon }}</span>
      <div class="results-banner__text">
        <span class="results-banner__label">{{ b.label }}</span>
        @if (b.reason) {
          <span class="results-banner__reason">{{ b.reason }}</span>
        }
      </div>
    </div>
  }

  @if (hasBody()) {
    <article #body
             class="results-view__body markdown-body"
             cacMarkdownLightbox
             data-testid="results-rendered"
             [attr.data-dossier-reference-scope]="projectName() ?? ''"
             (click)="onBodyClick($event)"
             [innerHTML]="bodyHtml()" tabindex="0" (keydown.enter)="onBodyClick($event)" (keydown.space)="onBodyClick($event); $event.preventDefault()"></article>
  } @else {
    <p class="results-view__empty" data-testid="results-empty">No result content.</p>
  }
</div>
