<section class="sidebar-card sidebar-card--toolbar">
  <div class="cli-config">
    <div class="cli-config__header">
      <span class="cli-config__title">🔧 CLI Configuration</span>
      <button class="detail__error-close" (click)="closeRequest.emit()">✕</button>
    </div>
    @if (status()) {
      <div class="cli-config__status">
        <app-status-indicator [tone]="availabilityTone(status()!.available)"
                              [label]="availabilityLabel(status()!)"
                              testId="cli-config-availability" />
      </div>
    }
    <div class="cli-config__row">
      <input class="cli-config__input" type="text"
             [value]="pathDraft()"
             (input)="pathDraftChange.emit($any($event.target).value)"
             placeholder="z.B. claude, C:\\Program Files\\Claude\\claude.exe" />
      <button class="btn-sm" (click)="testPath.emit()" [disabled]="testing()">
        @if (testing()) {
          <app-status-indicator tone="running" label="Testing" [compact]="true" testId="cli-config-testing" />
        } @else {
          🧪 Test
        }
      </button>
      <button class="btn-sm btn-sm--primary" (click)="savePath.emit()" [disabled]="testing()">💾 Save</button>
    </div>
    @if (testResult(); as result) {
      <div class="cli-config__status">
        <app-status-indicator [tone]="availabilityTone(result.available)"
                              [label]="testResultLabel(result)"
                              testId="cli-config-test-result" />
      </div>
    }
    <div class="cli-config__separator"></div>
    <div class="cli-config__row">
      <input class="cli-config__input" [type]="showToken() ? 'text' : 'password'"
             [value]="tokenDraft()"
             (input)="tokenDraftChange.emit($any($event.target).value)"
             placeholder="GitHub Token (PAT or OAuth)" />
      <button class="btn-sm" (click)="showToken.set(!showToken())">
        {{ showToken() ? '🙈' : '👁' }}
      </button>
      <button class="btn-sm btn-sm--primary" (click)="saveToken.emit()" [disabled]="tokenSaving()">
        {{ tokenSaving() ? '⏳' : '💾 Save Token' }}
      </button>
    </div>
    @if (status()) {
      <div class="cli-config__status">
        <app-status-indicator [tone]="tokenTone(status()!.hasToken)"
                              [label]="status()!.hasToken ? 'Token configured' : 'No token, CLI may fail to authenticate'"
                              testId="cli-config-token" />
      </div>
    }
  </div>
</section>
