<div class="commandbar"
     [class.commandbar--collapsed]="collapsed()"
     data-testid="commandbar">
  @if (collapsed()) {
    <span class="commandbar__status" data-testid="commandbar-running">
      <span class="commandbar__pulse"></span>
      <span class="commandbar__status-text">Running · {{ elapsedTime() }}</span>
    </span>
    <span class="commandbar__compact-meta">
      <app-cli-model-selector
        [cliType]="cliTypeDraft()"
        [model]="modelDraft()"
        [thinkingLevel]="thinkingLevelDraft()"
        [betterCandidates]="betterCandidates()"
        [availableModels]="availableModels()"
        [disabled]="true"
        triggerTestid="commandbar-agent"
        pickerTestidPrefix="commandbar-agent-picker" />
    </span>
    <span class="commandbar__spacer"></span>
    <button type="button"
            class="commandbar__toggle"
            data-testid="commandbar-show-setup"
            (click)="toggleCollapsed.emit()">
      Show setup
    </button>
    <button class="btn-exec btn-exec--stop commandbar__action" (click)="stopRequest.emit()">⏹ Stop</button>
  } @else {
    <!--
      Compressed Project chip: the text "Project" label is dropped from
      the visible chrome (the dropdown chevron is enough of a cue) and
      lives on aria-label/title for screen readers + hover. -->
    <label class="commandbar__field commandbar__field--chip commandbar__field--project">
      <span class="commandbar__label commandbar__label--sr" aria-hidden="false">Project</span>
      <select class="commandbar__select commandbar__select--chip"
              aria-label="Project"
              [cacTooltip]="'Project'"
              data-testid="commandbar-project"
              [ngModel]="currentWatchPath()"
              (ngModelChange)="projectChange.emit($event)">
        @for (wp of watchPaths(); track wp.path) {
          <option [value]="wp.path">{{ wp.name }}</option>
        }
      </select>
    </label>

    <app-cli-model-selector
      class="commandbar__agent"
      [cliType]="cliTypeDraft()"
      [model]="modelDraft()"
      [thinkingLevel]="thinkingLevelDraft()"
      [betterCandidates]="betterCandidates()"
      [availableModels]="availableModels()"
      [disabled]="isRunning()"
      triggerTestid="commandbar-agent"
      pickerTestidPrefix="commandbar-agent-picker"
      (cliTypeChange)="cliTypeChange.emit($event)"
      (modelChange)="modelChange.emit($event)"
      (thinkingLevelChange)="thinkingLevelChange.emit($event)" />

    @if (isRunning()) {
      <span class="commandbar__status" data-testid="commandbar-running">
        <span class="commandbar__pulse"></span>
        <span class="commandbar__status-text">{{ elapsedTime() }}</span>
      </span>
      <button type="button"
              class="commandbar__toggle"
              data-testid="commandbar-hide-setup"
              (click)="toggleCollapsed.emit()">
        Hide setup
      </button>
      <button class="btn-exec btn-exec--stop commandbar__action" (click)="stopRequest.emit()">⏹ Stop</button>
    } @else if (canStart()) {
      <button class="btn-exec btn-exec--start commandbar__action"
              data-testid="command-deck-start"
              (click)="startRequest.emit()"
              [disabled]="starting() || !!startDisabledReason()"
              [cacTooltip]="startDisabledReason()">
        {{ starting() ? '⏳' : '▶ Start' }}
      </button>
      @if (startDisabledReason()) {
        <span class="commandbar__disabled-reason" data-testid="command-deck-start-disabled-reason">
          {{ startDisabledReason() }}
        </span>
      }
    }
  }
</div>
