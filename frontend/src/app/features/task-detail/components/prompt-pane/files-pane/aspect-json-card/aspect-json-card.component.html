<div class="aspect-json" [class.aspect-json--compact]="compact()" data-testid="aspect-json-card">
  <div class="aspect-json__meta-head">
    <span class="aspect-json__title">{{ title() }}</span>
    <app-status-indicator class="aspect-json__badge"
                          [tone]="statusTone()"
                          [label]="statusLabel()"
                          [compact]="true"
                          testId="aspect-json-status" />
    @if (!compact() && doc().model) {
      <span class="aspect-json__model" data-testid="aspect-json-model">{{ doc().model }}</span>
    }
  </div>

  @if (doc().summary) {
    <p class="aspect-json__summary" data-testid="aspect-json-summary">{{ doc().summary }}</p>
  }

  @if (!compact()) {
    @if (metricEntries().length > 0) {
      <ul class="aspect-json__metrics" data-testid="aspect-json-metrics">
        @for (m of metricEntries(); track m.key) {
          <li class="aspect-json__metric">
            <span class="aspect-json__metric-key">{{ m.key }}</span>
            <span class="aspect-json__metric-value">{{ m.value }}</span>
          </li>
        }
      </ul>
    }

    @if (doc().details) {
      <details class="aspect-json__details" data-testid="aspect-json-details">
        <summary class="aspect-json__details-summary">Details</summary>
        <div class="aspect-json__details-body">
          <cac-markdown [source]="doc().details" [dense]="true" />
        </div>
      </details>
    }
  }
</div>
