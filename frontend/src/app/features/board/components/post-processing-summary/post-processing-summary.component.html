<span class="summary"
      role="group"
      data-testid="lane-post-processing-summary"
      [attr.data-active-count]="summary().active"
      [attr.data-waiting-count]="summary().waiting"
      [attr.aria-label]="summary().tooltip"
      tabindex="0"
      [cacTooltip]="summary().tooltip">
  <span class="summary__full" data-testid="lane-post-processing-summary-full">
    {{ summary().active }} active / {{ summary().waiting }} waiting
  </span>
  <span class="summary__compact"
        data-testid="lane-post-processing-summary-compact"
        aria-hidden="true">{{ summary().active }}/{{ summary().waiting }}</span>
</span>
