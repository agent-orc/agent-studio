@if (activity(); as value) {
  <app-status-indicator [cacTooltip]="value.tooltip"
                        data-testid="task-card-post-processing-activity"
                        [attr.data-activity-state]="value.tone"
                        role="status"
                        [tone]="activityTone(value.tone)"
                        [label]="value.label"
                        [compact]="true"
                        testId="task-card-post-processing-activity-status" />
}
