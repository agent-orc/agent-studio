<div class="column__spacer" [style.height.px]="window().top" data-testid="lane-window-before"></div>
@for (row of window().rows; track row.job.taskKey) {
  <div class="column__window-row" [attr.data-window-key]="row.job.taskKey" [attr.data-window-index]="row.index">
    @if (row.group; as group) {
      <app-lane-group-head class="column__window-group" [attr.data-testid]="group.testid" [group]="group"
                           [mutationsBlocked]="mutationsBlocked()" />
    }
    @if (!grouped() && !reorderDisabled() && !mutationsBlocked()) {
      <div class="column__drop-zone" [class.column__drop-zone--active]="dropIndex() === row.index"
           (dragover)="slotDragOver.emit({ event: $event, index: row.index })"
           (dragleave)="slotDragLeave.emit()"
           (drop)="slotDrop.emit({ event: $event, index: row.index })"></div>
    }
    <app-job-card [job]="row.job" [compact]="compact()" [highlightJobId]="highlightJobId()"
                  [mutationsBlocked]="mutationsBlocked()" [draggable]="!mutationsBlocked()"
                  (click)="jobClick.emit(row.job)" (deleteRequested)="deleteRequested.emit($event)"
                  (pickNextRequested)="pickNextRequested.emit($event)"
                  (dragstart)="dragStarted.emit({ event: $event, job: row.job })" />
  </div>
}
<div class="column__spacer" [style.height.px]="window().bottom" data-testid="lane-window-after"></div>
@if (!grouped() && !reorderDisabled() && !mutationsBlocked() && window().end === count()) {
  <div class="column__drop-zone column__drop-zone--last" data-testid="lane-drop-slot-end"
       [class.column__drop-zone--active]="dropIndex() === count()"
       (dragover)="slotDragOver.emit({ event: $event, index: count() })"
       (dragleave)="slotDragLeave.emit()"
       (drop)="slotDrop.emit({ event: $event, index: count() })"></div>
}
