@if (task().state === autoReviewState && task().reviewQueuePosition; as position) {
  <app-status-indicator [attr.data-priority]="task().reviewPriority"
                        [cacTooltip]="'Review queue position ' + position"
                        [tone]="priorityTone(task().reviewPriority)"
                        [label]="(task().reviewPriority === 'urgent' ? 'Urgent · ' : '') + 'Review #' + position"
                        [compact]="true"
                        testId="task-card-review-queue" />
} @else if (task().state === autoReviewState && task().reviewPriority === 'urgent') {
  <app-status-indicator data-priority="urgent" cacTooltip="Priority applies when review is ready"
                        [tone]="priorityTone('urgent')" label="Urgent" [compact]="true"
                        testId="task-card-review-queue" />
}
