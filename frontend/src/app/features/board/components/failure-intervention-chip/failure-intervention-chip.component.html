@if (followUp(); as item) {
  <button type="button"
          class="intervention-chip"
          data-testid="task-card-intervention"
          [attr.data-intervention-state]="item.state"
          [cacTooltip]="'Orchestrator intervention raised from this failure. Open ' + item.key"
          (click)="navigate($event)">
    <app-status-indicator [tone]="item.tone" [label]="item.key + ' · ' + item.lane + ' · ' + item.state"
                          [compact]="true" testId="task-card-intervention-status" />
  </button>
}
