<app-execution-location-badge [execution]="execution()" />
@if (state() !== '3-progress' && execution()?.state === 'remote-running') {
  <app-status-indicator tone="warning" label="Remote run still live" [compact]="true"
                        testId="task-card-live-remote-outside-progress" />
}
@if (olderBriefPending()) {
  <app-status-indicator tone="info" label="Older brief delivery" [compact]="true"
                        testId="task-card-older-brief-offer" />
}
