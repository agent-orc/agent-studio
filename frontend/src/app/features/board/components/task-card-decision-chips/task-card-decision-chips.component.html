@if (badge(); as db) {
  <span class="decision-chip decision-chip--decider" data-testid="task-card-decider"
        [attr.data-open]="db.open" [cacTooltip]="db.tooltip">{{ db.open ? 'Decider' : 'Decided by' }}: {{ db.decider }}</span>
}
@for (key of blockers(); track key) {
  <button type="button"
          class="decision-chip decision-chip--blocked-by"
          data-testid="task-card-blocked-by"
          [attr.data-key]="key"
          [cacTooltip]="blockTooltip() + ' Click to open ' + key + '.'"
          (click)="open(key, $event)">blocked by {{ key }}</button>
}
