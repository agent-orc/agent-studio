@if (parkedBadge(); as park) {
  <app-status-indicator [cacTooltip]="park.tooltip"
                        [attr.data-park-kind]="park.tone"
                        [tone]="parkTone(park.tone)"
                        [label]="park.label"
                        [compact]="true"
                        testId="task-card-parked" />
}
@if (decisionDamBadge(); as dam) {
  <app-status-indicator [cacTooltip]="dam.tooltip"
                        tone="danger"
                        [label]="dam.label"
                        [compact]="true"
                        testId="task-card-decision-dam" />
}
@if (humanReviewBadge(); as review) {
  <app-status-indicator [cacTooltip]="review.tooltip"
                        tone="danger"
                        [label]="review.label"
                        [compact]="true"
                        testId="task-card-human-review" />
}
