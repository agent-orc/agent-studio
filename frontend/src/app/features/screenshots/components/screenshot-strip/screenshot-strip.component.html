<div class="strip" data-testid="screenshot-strip"
     [attr.data-variant]="variant()"
     [attr.aria-label]="ariaLabel()">
  <div class="strip__rail" role="list">
    @for (s of screenshots(); track s.url; let i = $index) {
      <button type="button"
              role="listitem"
              class="strip__thumb"
              [attr.data-testid]="'screenshot-thumb'"
              [attr.data-index]="i"
              [attr.data-status]="s.status ?? 'none'"
              [cacTooltip]="thumbTitle(s)"
              (click)="openLightbox(i)">
        @if ((s.sizeBytes ?? 0) > 2_000_000) {
          <span class="strip__large" data-testid="screenshot-large-placeholder">Large image · {{ ((s.sizeBytes ?? 0) / 1_000_000).toFixed(1) }} MB</span>
        } @else {
          <img class="strip__img" [src]="s.url" [alt]="s.caption" [attr.width]="s.width ?? 360" [attr.height]="s.height ?? 225" loading="lazy" decoding="async" />
        }
        @if (s.status === 'passed' || s.status === 'failed' || s.status === 'skipped') {
          <span class="strip__badge">
            <app-status-indicator [tone]="statusTone(s.status)" [label]="statusLabel(s.status)" [compact]="true"
                                  testId="screenshot-thumb-status" />
          </span>
        }
        <span class="strip__caption">
          <span class="strip__caption-spec">{{ s.caption }}</span>
          <span class="strip__caption-ts">{{ formatTimestamp(s.timestampUtc) }}</span>
          @if (sourceLabel(s); as src) {
            <span class="strip__caption-source"
                  [attr.data-source]="s.source"
                  [attr.data-testid]="'screenshot-source'"
                  [cacTooltip]="sourceTooltip(s)">{{ src }}</span>
          }
          @if (variant() === 'reel' && s.projectName) {
            <span class="strip__caption-project">{{ s.projectName }}</span>
          }
        </span>
      </button>
    }
  </div>
</div>

@if (active() !== null) {
  <div class="lightbox"
       data-testid="screenshot-lightbox"
       role="dialog"
       aria-modal="true"
       (click)="close()" (keydown.enter)="close()" (keydown.space)="close(); $event.preventDefault()">
    <button type="button" class="lightbox__close"
            data-testid="screenshot-lightbox-close"
            (click)="close(); $event.stopPropagation()"
            aria-label="Close">×</button>
    @if (current(); as c) {
      <button type="button" class="lightbox__nav lightbox__nav--prev"
              data-testid="screenshot-lightbox-prev"
              (click)="prev(); $event.stopPropagation()"
              aria-label="Previous">‹</button>
      <figure class="lightbox__figure" (click)="$event.stopPropagation()" tabindex="0" (keydown.enter)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation(); $event.preventDefault()">
        <div class="lightbox__stage" data-testid="screenshot-lightbox-stage">
          <img class="lightbox__img" [src]="c.url" [alt]="c.caption"
               data-testid="screenshot-lightbox-image" />
        </div>
        <figcaption class="lightbox__caption">
          <div class="lightbox__caption-main">
            <span class="lightbox__caption-spec" data-testid="screenshot-lightbox-caption">{{ c.caption }}</span>
            @if (c.status) {
              <span class="lightbox__status" [attr.data-status]="c.status">
                <app-status-indicator [tone]="statusTone(c.status)" [label]="statusLabel(c.status)"
                                      testId="screenshot-lightbox-status" />
              </span>
            }
            @if (sourceLabel(c); as src) {
              <span class="lightbox__source"
                    [attr.data-source]="c.source"
                    data-testid="screenshot-lightbox-source"
                    [cacTooltip]="sourceTooltip(c)">{{ src }}</span>
            }
            <span class="lightbox__index" data-testid="screenshot-lightbox-index">
              {{ activeIndex() + 1 }} / {{ screenshots().length }}
            </span>
          </div>
          <div class="lightbox__caption-meta">
            <span>{{ formatTimestamp(c.timestampUtc) }}</span>
            @if (c.projectName) {
              <span>·</span>
              <span>{{ c.projectName }}</span>
            }
            @if (c.jobTitle && variant() === 'reel') {
              <span>·</span>
              <a class="lightbox__task-link"
                 data-testid="screenshot-lightbox-open-task"
                 href="javascript:void(0)"
                 (click)="onOpenTask(c); $event.stopPropagation()">
                Open task
              </a>
            }
            <span>·</span>
            <button type="button" class="lightbox__path-btn"
                    data-testid="screenshot-lightbox-open-explorer"
                    (click)="copyLocalPath(c); $event.stopPropagation()"
                    [cacTooltip]="c.localPath">
              {{ pathButtonLabel() }}
            </button>
          </div>
        </figcaption>
      </figure>
      <button type="button" class="lightbox__nav lightbox__nav--next"
              data-testid="screenshot-lightbox-next"
              (click)="next(); $event.stopPropagation()"
              aria-label="Next">›</button>
    }
  </div>
}
