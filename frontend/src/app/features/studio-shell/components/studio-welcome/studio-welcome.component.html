<div class="studio-welcome" data-testid="studio-welcome">
  <app-studio-empty-state class="studio-welcome__idle" />
  <section class="studio-welcome__content"
           data-testid="studio-welcome-content"
           aria-labelledby="studio-welcome-title">
    <p class="studio-welcome__eyebrow">Welcome</p>
    <h2 class="studio-welcome__title" id="studio-welcome-title">Agent Software Studio</h2>
    @if (projects().length > 0) {
      <div class="studio-welcome__primary" data-testid="studio-welcome-chat-hint">
        <button type="button" class="studio-button studio-button--primary studio-welcome__chat-cta"
                data-testid="studio-welcome-deployment-dashboard"
                (click)="deploymentDashboardOpened.emit()">Deployment dashboard</button>
        <button type="button"
                class="studio-button studio-button--primary studio-welcome__chat-cta"
                data-testid="studio-welcome-open-chat"
                (click)="chatOpened.emit()">Open project chat</button>
      </div>
      <h3 class="studio-welcome__section-title">Project boards</h3>
    }
    <div class="studio-welcome__projects">
      @for (project of projects(); track project.name) {
        <button type="button"
                class="studio-welcome__project"
                (click)="boardOpened.emit(project.name)">
          <span class="studio-welcome__project-glyph"
                [style.background]="project.color"
                aria-hidden="true">{{ project.initial }}</span>
          <span>{{ project.name }}</span>
          <span class="studio-welcome__project-count">{{ project.totalJobs }}</span>
        </button>
      }
      @if (projects().length > 0) {
        <button type="button"
                class="studio-welcome__project studio-welcome__project--all"
                (click)="boardOpened.emit('__all__')">
          <span class="studio-welcome__project-glyph" aria-hidden="true">▦</span>
          <span>All projects</span>
        </button>
      }
    </div>
    @if (projects().length === 0) {
      <app-empty-state>No projects loaded. Check the backend connection.</app-empty-state>
    }
  </section>
</div>
