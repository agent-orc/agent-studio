<aside class="studio-activitybar" data-testid="studio-activity-bar">
  <!-- Panel toggles lead the rail so the Explorer sits at the very top of
       the activity bar (its first-class destination). The cross-project
       "All projects" board is no longer reachable from here — it opens
       only via the grid button in the Explorer panel header. -->
  @for (item of items(); track item.key) {
    <button type="button"
            class="studio-ab__btn"
            [class.studio-ab__btn--active]="activeKey() === item.key"
            [cacTooltip]="item.label"
            [attr.data-panel]="item.key"
            [attr.data-testid]="'studio-ab-' + item.key"
            (click)="panelToggle.emit(item.key)">
      <svg class="studio-ab__svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true">
        @switch (item.icon) {
          @case ('folder') {
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          }
          @case ('filter') {
            <path d="M4 5h16l-6 8v6l-4 2v-8z" />
          }
          @case ('cli') {
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <polyline points="7 10 10 13 7 16" />
            <line x1="13" y1="16" x2="17" y2="16" />
          }
          @case ('activity') {
            <polyline points="4 12 8 12 11 5 13 19 16 12 20 12" />
          }
          @case ('runbook') {
            <circle cx="12" cy="12" r="8" />
            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none" />
          }
        }
      </svg>
      @if (badgeCounts()[item.key]; as count) {
        <span class="studio-ab__badge"
              [class.studio-ab__badge--alerts]="item.key === 'activity'"
              [cacTooltip]="badgeLabel(item, count)"
              [attr.data-testid]="'studio-ab-badge-' + item.key"
              [attr.aria-label]="item.key === 'activity' ? badgeLabel(item, count) : null">
          {{ count > 99 ? '99+' : count }}
        </span>
      }
    </button>
  }
  <!-- Epic overview destination. Hidden when no epics exist (hide-when-empty),
       so it never adds clutter for projects that don't use epics. Opens the
       read-only rollup as a normal editor tab. -->
  @if (hasEpics()) {
    <button type="button"
            class="studio-ab__btn studio-ab__btn--epics"
            [class.studio-ab__btn--active]="activeKey() === 'epics'"
            cacTooltip="Open epic overview"
            data-testid="studio-ab-epics"
            (click)="openEpicsRequest.emit()">
      <app-studio-icon name="epic" [size]="22"></app-studio-icon>
    </button>
  }
  <button type="button"
          class="studio-ab__btn"
          [class.studio-ab__btn--active]="activeKey() === 'chats'"
          [attr.aria-pressed]="activeKey() === 'chats'"
          cacTooltip="Chats"
          aria-label="Chats"
          data-testid="studio-ab-chats"
          (click)="chatsToggleRequest.emit()">
    <app-studio-icon name="bot" [size]="22"></app-studio-icon>
  </button>
  <button type="button"
          class="studio-ab__btn"
          [class.studio-ab__btn--active]="activeKey() === 'workbenches'"
          cacTooltip="Dossiers"
          data-testid="studio-ab-workbenches"
          (click)="openWorkbenchesRequest.emit()">
    <app-studio-icon name="eye" [size]="22"></app-studio-icon>
  </button>
  <span class="studio-ab__spacer"></span>
  <button type="button"
          class="studio-ab__btn"
          [class.studio-ab__btn--active]="activeKey() === 'settings'"
          cacTooltip="Settings"
          data-testid="studio-ab-settings"
          (click)="panelToggle.emit('settings')">
    <svg class="studio-ab__svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true">
      <circle cx="12" cy="12" r="3" />
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1A2 2 0 1 1 4.3 17l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9 1.7 1.7 0 0 0 4.3 7.2L4.2 7A2 2 0 1 1 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1A2 2 0 1 1 19.7 7l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
    </svg>
  </button>
</aside>
