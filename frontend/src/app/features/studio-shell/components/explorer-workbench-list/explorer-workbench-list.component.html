<app-tree-row level="child" glyph="book" label="Dossiers"
              [count]="pendingDecisionCount() > 0 ? pendingDecisionCount() : null"
              [ariaLabel]="dossierAriaLabel()"
              [active]="dossierActive()"
              [ariaCurrent]="dossierActive() ? 'page' : null"
              [testid]="'studio-explorer-project-workbenches-' + projectName()"
              (selectRequest)="openOverview.emit()" />
@if (styleGuide(); as guide) {
  <app-tree-row level="child" glyph="book" label="Style Guide"
                [active]="activeWorkbenchId() === guide.id"
                [ariaCurrent]="activeWorkbenchId() === guide.id ? 'page' : null"
                [ariaLabel]="'Style Guide, ' + accessibleMeta(guide)"
                [tooltip]="navTooltip(guide)"
                [tooltipTestId]="'studio-explorer-workbench-tooltip-' + projectName() + '-' + guide.id"
                [testid]="'studio-explorer-project-style-guide-' + projectName()"
                (selectRequest)="openWorkbench.emit(guide)">
    <i class="studio-workbench-status-dot" aria-hidden="true" [attr.data-status]="guide.status"></i>
  </app-tree-row>
}
