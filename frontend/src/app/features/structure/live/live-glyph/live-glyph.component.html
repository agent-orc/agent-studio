<svg class="live-glyph" [attr.data-glyph]="name()" [attr.data-off]="off() || null" viewBox="0 0 26 14" aria-hidden="true" focusable="false">

    @case ('perf') { <path class="fill" d="M3 9h4v4H3zM11 5h4v8h-4zM19 1h4v12h-4z" /> }
    @case ('network') { <path class="line" d="M1 7h8M17 7h8" /><rect class="line surface" x="9" y="3" width="8" height="8" /> }
    @case ('storage') { <rect class="fill" x="2" y="1.5" width="22" height="3" /><rect class="fill" x="2" y="5.5" width="15" height="3" /><rect class="fill" x="2" y="9.5" width="19" height="3" /> }

    @case ('warnings') { <path class="fill" d="M13 1l8 12H5z" /><path class="cut" d="M13 5.2v3.6M13 10.2v1.2" /> }
    @case ('boundary') { <rect class="line strong dashdot" x="1" y="1" width="24" height="12" rx="2" /> }
    @case ('machine') { <rect class="line strong surface" x="1" y="1" width="24" height="12" rx="3" /> }
    @case ('vm') { <rect class="line surface" x="1" y="1" width="24" height="12" rx="2.5" /><rect class="line" x="3.5" y="3.5" width="19" height="7" rx="1" /> }
    @case ('group') { <rect class="line dashed" x="1" y="1" width="24" height="12" rx="2" /> }
    @case ('container') { <rect class="line surface" x="1" y="1" width="24" height="12" rx="2.5" /> }
    @case ('service') { <path class="line surface" d="M6 1H25V13H1V6Z" /> }
    @case ('disk') { <rect class="line surface" x="1" y="3" width="24" height="8" rx="4" /><rect class="fill" x="4" y="6" width="13" height="2" /> }
    @case ('external') { <rect class="line dotted" x="1" y="1" width="24" height="12" rx="2" /> }
    @case ('target') { <rect class="line dashed" x="1" y="1" width="24" height="12" rx="2" /><path class="line" d="M5 13l7-12M12 13l7-12" /> }
  }
</svg>
