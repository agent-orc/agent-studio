<div class="runners" data-testid="access-runners">
  @if (access.runnersError(); as message) { <p class="runners__error" role="alert" data-testid="access-runners-error">{{ message }}</p> }

  <app-page-section level="sub" anchor="access-enrolled-runners" title="Enrolled runners" [count]="runners().length">
    <app-data-grid label="Enrolled runners" testId="access-enrolled-runners" [columns]="runnerColumns" [rows]="runners()" [rowId]="runnerId"
                   [rowLabel]="runnerLabel" [rowTestId]="runnerTestId" [rowMuted]="runnerMuted" [selectable]="true"
                   [selectedId]="selection.selectedId('runner')" (rowSelect)="selection.open('runner', $event.id)">
      <ng-template appGridCell="access" [appGridCellOf]="runners()" let-row>
        <span class="runners__access" [attr.data-testid]="'access-runner-projects-' + row.id">
          <app-chip [label]="row.identity" [detail]="row.projects" />
          @if (row.runner.projectsNotice; as notice) { <app-status-indicator tone="neutral" label="Before binding" [detail]="notice" [compact]="true" /> }
        </span>
      </ng-template>
      <ng-template appGridCell="state" [appGridCellOf]="runners()" let-row>
        <app-status-indicator [tone]="row.revoked ? 'neutral' : 'success'" [label]="row.revoked ? 'Revoked' : 'Active'" [compact]="true" testId="access-runner-status" />
      </ng-template>
      <ng-template appGridCell="meta" [appGridCellOf]="runners()" let-row>
        <span class="runners__numeric" [attr.data-testid]="'access-runner-expiry-' + row.id">
          @if (row.revoked) { <span class="runners__none">–</span> }
          @else if (row.expiry.tone) { <app-status-indicator [tone]="row.expiry.tone" [label]="row.expiry.label" [detail]="row.expiry.notice" [compact]="true" /> }
          @else if (row.expiry.label) { {{ row.expiry.label }} }
          @else { <span class="runners__none">–</span> }
        </span>
      </ng-template>
      <ng-template appGridCell="actions" [appGridCellOf]="runners()" let-row>
        <app-overflow-menu [label]="'Actions for ' + row.name" [items]="row.menu" [testId]="'access-runner-menu-' + row.id" (itemSelect)="actRunner($event, row)" />
      </ng-template>
      <app-empty-state gridEmpty title="No runner is enrolled" body="A runner or the orchestration engine appears here once it has used an enrollment code." />
    </app-data-grid>
  </app-page-section>

  <app-page-section level="sub" anchor="access-enrollment-codes" title="Enrollment codes" [count]="enrollments().length"
                    purpose="A code works once, for a single runner, and for 15 minutes.">
    <app-data-grid label="Enrollment codes" testId="access-enrollments" [columns]="enrollmentColumns" [rows]="enrollments()" [rowId]="enrollmentId"
                   [rowLabel]="enrollmentLabel" [rowTestId]="enrollmentTestId" [rowMuted]="enrollmentMuted" [selectable]="true"
                   [selectedId]="selection.selectedId('enrollment')" (rowSelect)="selection.open('enrollment', $event.id)">
      <ng-template appGridCell="access" [appGridCellOf]="enrollments()" let-row>
        <app-chip [label]="row.identity" [detail]="row.projects || null" />
      </ng-template>
      <ng-template appGridCell="state" [appGridCellOf]="enrollments()" let-row>
        <app-status-indicator [tone]="row.tone" [label]="row.status" [compact]="true" testId="access-enrollment-status" />
      </ng-template>
      <ng-template appGridCell="meta" [appGridCellOf]="enrollments()" let-row><span class="runners__numeric">{{ row.expires }}</span></ng-template>
      <ng-template appGridCell="actions" [appGridCellOf]="enrollments()" let-row>
        <app-overflow-menu [label]="'Actions for the code for ' + row.name" [items]="row.menu" [testId]="'access-enrollment-menu-' + row.id" (itemSelect)="actEnrollment($event, row)" />
      </ng-template>
      <app-empty-state gridEmpty [compact]="true" title="No enrollment codes" body="Create a code, then use it once on the host that becomes the runner." />
    </app-data-grid>
  </app-page-section>
</div>
