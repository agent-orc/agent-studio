<app-data-grid [label]="api() ? 'API tokens' : 'Service accounts'" [testId]="api() ? 'access-api-tokens' : 'access-service-accounts'"
               [columns]="columns()" [rows]="rows()" [rowId]="rowId" [rowLabel]="rowLabel" [rowTestId]="rowTestId" [rowMuted]="muted"
               [selectable]="true" [selectedId]="selection.selectedId(kind())" (rowSelect)="selection.open(kind(), $event.id)">
  <ng-template appGridCell="access" [appGridCellOf]="rows()" let-row>
    <app-access-grants [grants]="row.grants" [fit]="true" emptyLabel="No role: reaches nothing" />
  </ng-template>
  <ng-template appGridCell="state" [appGridCellOf]="rows()" let-row>
    <app-status-indicator [tone]="row.disabled ? 'neutral' : 'success'" [label]="row.disabled ? 'Disabled' : 'Active'" [compact]="true"
                          [testId]="'access-service-account-status-' + row.id" />
  </ng-template>
  <ng-template appGridCell="meta" [appGridCellOf]="rows()" let-row>
    @if (row.tokens) { <span class="access-numeric">{{ row.tokens }}</span> } @else { <span class="none">–</span> }
  </ng-template>
  <ng-template appGridCell="actions" [appGridCellOf]="rows()" let-row>
    <app-overflow-menu [label]="'Actions for ' + row.name" [items]="row.menu" [testId]="'access-service-account-menu-' + row.id" (itemSelect)="act($event, row)" />
  </ng-template>
  @if (api()) {
    <app-empty-state gridEmpty title="No API tokens" body="A token a person created for a tool or the operator CLI is listed here with its role and expiry." />
  } @else {
    <app-empty-state gridEmpty title="No service accounts" body="Scripts and deploy jobs get their own account here, with roles and tokens of their own." />
  }
</app-data-grid>
