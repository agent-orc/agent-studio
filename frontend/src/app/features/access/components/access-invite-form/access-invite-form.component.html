<div class="access-form" data-testid="access-invite-form">
  <div class="access-form__row">
    <label class="access-field">Username
      <input data-testid="access-invite-username" autocomplete="off" [value]="username()" (input)="username.set($any($event.target).value)" />
    </label>
    <label class="access-field">Display name
      <input data-testid="access-invite-display-name" autocomplete="off" [value]="displayName()" (input)="displayName.set($any($event.target).value)" />
    </label>
  </div>
  <app-access-grant-form [roles]="access.overview()?.roles ?? []" [projects]="access.projects()" principalKind="user" (grantChange)="grant.set($event)" />
  <div class="access-form__actions">
    <button type="button" class="btn btn--primary" data-testid="access-invite-submit" [disabled]="!canInvite()" (click)="invite()">Create invitation</button>
  </div>
  @if (pending(); as invitee) {
    <p class="access-hint" role="status" data-testid="access-invite-pending">Creating invitation for {{ invitee.username }} with {{ invitee.role }} role…</p>
  }
  @if (link(); as created) {
    <app-secret-reveal testId="access-invite-link" [title]="'Invitation for ' + created.username" [value]="created.url" copyLabel="Copy link"
      [note]="'Send this invitation only to ' + created.username + '. It works once and expires at ' + created.expiresAt + '. ' + created.factor"
      (dismissed)="link.set(null)" />
  }
</div>
