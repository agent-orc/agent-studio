<app-data-grid label="Groups" testId="access-groups" [columns]="columns" [rows]="rows()" [rowId]="rowId" [rowLabel]="rowLabel"
               [rowTestId]="rowTestId" [selectable]="true" [selectedId]="selection.selectedId('group')"
               (rowSelect)="selection.open('group', $event.id)">
  <ng-template appGridCell="access" [appGridCellOf]="rows()" let-row>
    <app-access-grants [grants]="row.grants" [fit]="true" />
  </ng-template>
  <ng-template appGridCell="state" [appGridCellOf]="rows()" let-row>
    <app-status-indicator [tone]="row.tone" [label]="row.status" [compact]="true" [testId]="'access-group-status-' + row.id" />
  </ng-template>
  <ng-template appGridCell="actions" [appGridCellOf]="rows()" let-row>
    <app-overflow-menu [label]="'Actions for ' + row.name" [items]="row.menu" [testId]="'access-group-menu-' + row.id" (itemSelect)="act($event, row)" />
  </ng-template>
  <app-empty-state gridEmpty title="No groups" body="A group holds a role once for several people. A single user needs none; create one when people share a role." />
</app-data-grid>
