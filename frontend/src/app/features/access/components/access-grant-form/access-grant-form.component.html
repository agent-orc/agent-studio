<div class="access-row" data-testid="access-grant-form">
  <label>Scope
    <select data-testid="access-grant-scope" (change)="setScopeKind($any($event.target).value)">
      @for (option of scopeKinds; track option.kind) {
        <option [value]="option.kind" [selected]="option.kind === scopeKind()">{{ option.label }}</option>
      }
    </select>
  </label>
  @if (scopeKind() !== 'workspace') {
    <label>Project
      <select data-testid="access-grant-project" (change)="project.set($any($event.target).value)">
        <option value="" [selected]="!project()">Choose a project</option>
        @for (item of projects(); track item.id) {
          <option [value]="item.id" [selected]="item.id === project()">{{ item.displayName }}</option>
        }
      </select>
    </label>
  }
  @if (scopeKind() === 'environment') {
    <label>Environment
      <select data-testid="access-grant-environment" (change)="environment.set($any($event.target).value)">
        @for (item of environments; track item.key) {
          <option [value]="item.key" [selected]="item.key === environment()">{{ item.label }}</option>
        }
      </select>
    </label>
  }
  <label>Role
    <select data-testid="access-grant-role" (change)="role.set($any($event.target).value)">
      @for (item of availableRoles(); track item.id) {
        <option [value]="item.id" [selected]="item.id === role()">{{ item.displayName }}</option>
      }
    </select>
  </label>
</div>
@if (roleDescription()) {
  <p class="access-hint" data-testid="access-grant-role-description">{{ roleDescription() }}</p>
}
