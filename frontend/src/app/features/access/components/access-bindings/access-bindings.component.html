<div class="bindings" data-testid="access-bindings">
  @for (scope of scopes(); track scope.key) {
    <app-page-section level="sub" [anchor]="'access-scope-' + scope.key" [testId]="'access-scope-' + scope.key" [title]="scope.title"
                      [count]="scope.rows.length" [purpose]="scope.kind">
      <app-data-grid [label]="'Role bindings in ' + scope.title" [columns]="columns" [rows]="scope.rows" [rowId]="rowId" [rowLabel]="rowLabel"
                     [rowTestId]="rowTestId" [selectable]="true" (rowSelect)="open($event)">
        <ng-template appGridCell="access" [appGridCellOf]="scope.rows" let-row>
          <app-chip [label]="row.role" [emphasis]="row.owner ? 'strong' : 'default'" />
        </ng-template>
        <ng-template appGridCell="actions" [appGridCellOf]="scope.rows" let-row>
          <app-overflow-menu [label]="'Actions for ' + row.role + ' of ' + row.name" [items]="row.menu" [testId]="'access-binding-menu-' + row.id"
                             (itemSelect)="open(row, $event === 'remove')" />
        </ng-template>
      </app-data-grid>
    </app-page-section>
  } @empty {
    <app-empty-state testid="access-bindings-empty" title="No role bindings yet" body="Each role a person, group or service account holds is listed here under the scope it applies to." />
  }
</div>
