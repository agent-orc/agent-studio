<div class="hquota">
  @for (card of cards(); track card.cliType) {
    <button type="button"
            class="hquota__card"
            [disabled]="networked()"
            [attr.data-testid]="'hquota-card-' + card.cliType"
            [attr.aria-label]="card.ariaLabel"
            [class.hquota__card--error]="!!card.error"
            [class.hquota__card--stale]="card.stale"
            [attr.data-tone]="card.tone"
            [attr.data-state]="card.state"
            (click)="select(card.cliType)">
      <span class="hquota__lead" aria-hidden="true">
        <span class="hquota__icon">{{ card.icon }}</span>
      </span>
      <span class="hquota__id">
        <span class="hquota__label">{{ card.label }}</span>
      </span>

      <span class="hquota__chips">
        @for (chip of card.chips; track chip.windowKey) {
          <span class="hquota__metric"
                [attr.data-testid]="'hquota-' + card.cliType + '-' + chip.windowKey"
                [attr.data-tone]="chip.tone">
            @if (chip.tag) {
              <span class="hquota__tag">{{ chip.tag }}</span>
            }
            <span class="hquota__value">{{ chip.value }}</span>
            <span class="hquota__bar"><span class="hquota__bar-fill" [style.width.%]="chip.barPct"></span></span>
          </span>
        }
      </span>

      @if (card.probeFailureLabel) {
        <span class="hquota__stale-label"
              data-testid="hquota-stale-marker"
              [cacTooltip]="card.error ?? card.probeFailureLabel">stale</span>
      } @else if (card.stale) {
        <span class="hquota__stale-dot" aria-label="Stale snapshot">●</span>
      }
    </button>
  }
</div>
