schemaVersion: 1
stack: [dotnet, node, playwright]
toolVersions:
  node: .nvmrc
  dotnetSdk: global.json
commands:
  prepare: .agent-studio/prepare
  build:
    - dotnet build agent-taskboard.sln --no-restore
    - bash scripts/npm-frontend.sh run build
  test:
    - dotnet test backend.Tests/OrchestratorApi.Tests.csproj --no-build --filter Category!=MachineBound
    - dotnet test runner.Tests/AgentRunner.Tests.csproj --no-build --filter Category!=MachineBound
    - dotnet test task-server.Tests/TaskServer.Tests.csproj --no-build --filter Category!=MachineBound
    - bash scripts/npm-frontend.sh run test:ci
  lint:
    - bash scripts/npm-frontend.sh run lint
testSuites:
  - id: backend-routine
    category: routine
    expectedDurationSeconds: 1440
    command: dotnet test backend.Tests/OrchestratorApi.Tests.csproj --no-build --filter Category!=MachineBound
  - id: runner-routine
    category: routine
    expectedDurationSeconds: 90
    command: dotnet test runner.Tests/AgentRunner.Tests.csproj --no-build --filter Category!=MachineBound
  - id: task-server-routine
    category: routine
    expectedDurationSeconds: 150
    command: dotnet test task-server.Tests/TaskServer.Tests.csproj --no-build --filter Category!=MachineBound
  # Coverage runs outside review gates (Dossier test-acceleration B11): the
  # collector made the same backend tests 1.7-2.5x slower on agent-runner-01.
  - id: backend-coverage
    category: release
    expectedDurationSeconds: 3600
    command: dotnet test backend.Tests/OrchestratorApi.Tests.csproj --no-build --filter Category!=MachineBound --collect "Code Coverage;Format=Cobertura" --results-directory coverage/dotnet/backend
  - id: runner-coverage
    category: release
    expectedDurationSeconds: 180
    command: dotnet test runner.Tests/AgentRunner.Tests.csproj --no-build --filter Category!=MachineBound --collect "Code Coverage;Format=Cobertura" --results-directory coverage/dotnet/runner
  - id: task-server-coverage
    category: release
    expectedDurationSeconds: 300
    command: dotnet test task-server.Tests/TaskServer.Tests.csproj --no-build --filter Category!=MachineBound --collect "Code Coverage;Format=Cobertura" --results-directory coverage/dotnet/task-server
  - id: frontend-unit
    category: routine
    expectedDurationSeconds: 360
    command: bash scripts/npm-frontend.sh run test:ci
  # Writes coverage/frontend/lcov.info for the scheduled coverage run (AGT-3074).
  - id: frontend-coverage
    category: release
    expectedDurationSeconds: 600
    command: bash scripts/npm-frontend.sh run test:release
  - id: frontend-e2e
    category: machine-bound
    expectedDurationSeconds: 900
    command: bash scripts/npm-frontend.sh run e2e
  - id: task-switch-workstation-budget
    category: machine-bound
    expectedDurationSeconds: 5400
    command: bash scripts/npm-frontend.sh run e2e:task-switch-budget
cachePaths:
  - frontend/node_modules
capabilities: [git, child-process, loopback-network]
environment:
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  # Windows gate: the prepare process starts with a cleared environment and
  # powershell.exe cannot load without SystemRoot (error 8009001d). Ignored on
  # Linux. Remove once the gate passes the Windows base variables (AGT-2822).
  SystemRoot: 'C:\Windows'
release:
  identity:
    - package: CodingAgentRunner
      ecosystem: nuget
      source: backend/packages.lock.json
    - package: coding-agent-chat
      ecosystem: npm
      source: frontend/package-lock.json
  restore:
    - dotnet restore backend/OrchestratorApi.csproj --locked-mode
    - bash scripts/npm-frontend.sh ci
devServer:
  command: bash scripts/npm-frontend.sh start
  workingDirectory: .
  healthUrl: http://127.0.0.1:4010
  startupTimeoutSeconds: 120
  stopWithRun: true
