schemaVersion: 1
stack: [node]
toolVersions: {}
commands:
  prepare: .agent-studio/prepare
  build:
    - npm run build
  test:
    - npm test
  lint: []
testSuites:
  - id: unit
    category: routine
    expectedDurationSeconds: 30
    command: npm test
cachePaths: [node_modules, dist]
capabilities: [git, child-process]
environment: {}

# Schema 2 deployment section (commented out). Studio writes it for you:
# Settings > Pipeline > "Preview schema 2 migration", then "Add deploy steps".
# To write it by hand instead, change schemaVersion above to 2, uncomment every
# line below the marker, and replace the project id, deploy host id (web-vm),
# directories, and URLs with your own. Directories stay below /srv.
