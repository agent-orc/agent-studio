schemaVersion: 2
stack: [node]
toolVersions: {}
commands:
  prepare: .agent-studio/prepare
  build:
    - npm run build
  test:
    - npm test
  lint: []
testSuites:
  - id: unit
    category: routine
    expectedDurationSeconds: 30
    command: npm test
cachePaths: [node_modules]
capabilities: [git, child-process, loopback-network]
environment: {}
# Rename the id to your project's identifier.
project:
  id: container-service
artifacts:
  - name: service
    type: container
    path: .
    dockerfile: Dockerfile
# Studio sets OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_PROTOCOL and
# OTEL_EXPORTER_OTLP_HEADERS with an ingest token for environments with
# telemetry: true, so their metrics and logs reach Operations.
environments:
  - name: staging
    protected: false
    telemetry: true
  - name: production
    protected: true
    telemetry: true
lifecycles:
  standard:
    - phase: staging
      automatic: true
    - phase: production
      approval: [Owner, Maintainer]
      requires: staging
# Replace app-host with the id of your deploy host and the health URLs with the
# addresses your proxy serves; see docs/deployments/README.md.
deploy:
  - step: container
    artifact: service
    target: app-host
    composeFile: /srv/apps/service/staging/compose.yml
    service: app
    healthUrl: https://staging.service.example.com/health
    healthTimeoutSeconds: 120
    environments: [staging]
  - step: container
    artifact: service
    target: app-host
    composeFile: /srv/apps/service/production/compose.yml
    service: app
    healthUrl: https://service.example.com/health
    healthTimeoutSeconds: 120
    environments: [production]
# The runbook scripts in deploy/runbooks read RUNBOOK_COMPOSE_FILE and
# RUNBOOK_SERVICE; keep them in step with the deploy section above.
variables:
  - name: LOG_LEVEL
    value: info
  - name: RUNBOOK_SERVICE
    value: app
  - name: RUNBOOK_COMPOSE_FILE
    value: /srv/apps/service/staging/compose.yml
    environments: [staging]
  - name: RUNBOOK_COMPOSE_FILE
    value: /srv/apps/service/production/compose.yml
    environments: [production]
# Each step runs deploy/runbooks/<step>.sh after the operator installs it on the
# deploy host (docs/deployments/README.md); each verifies the http health check.
runbooks:
  - name: restart
    steps: [restart]
    verify: health:http
  - name: disk-cleanup
    steps: [disk-cleanup]
    verify: health:http
