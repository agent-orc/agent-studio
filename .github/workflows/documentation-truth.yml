name: Documentation truth

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/check-public-docs.mjs'
      - '.github/workflows/documentation-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check public documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check public documentation
        run: node scripts/check-public-docs.mjs

      - name: Verify recorded release claims against the registries
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/check-public-docs.mjs --verify-registry
