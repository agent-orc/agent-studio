name: Documentation truth

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/operations/setup/install.md'
      - 'scripts/check-public-docs.mjs'
      - 'scripts/check-public-docs.test.mjs'
      - '.github/workflows/documentation-truth.yml'
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/check-public-docs.mjs'
      - 'scripts/check-public-docs.test.mjs'
      - '.github/workflows/documentation-truth.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check public documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check public documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test scripts/check-public-docs.test.mjs
          node scripts/check-public-docs.mjs --verify-install-urls

      - name: Verify recorded release claims against the registries
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/check-public-docs.mjs --verify-registry
