name: Build profile validation (Windows)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'backend/**'
      - 'backend.Tests/**'
      - '.github/workflows/build-profile-validation-windows.yml'
  workflow_dispatch:

jobs:
  build-profile-validation:
    name: Host-native dotnet profile
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate host-native shell and retained pickup state
        run: >-
          dotnet test backend.Tests/OrchestratorApi.Tests.csproj
          --filter "FullyQualifiedName=AgentStudio.Tests.BuildProfileValidationServiceTests.DotnetProfile_UsesHostShell_ValidatesGreenAndAllowsPickup|FullyQualifiedName=AgentStudio.Tests.ProjectSettingsServiceTests.ChangingOnlyTestFilter_PreservesPipelineReadyValidation"
          --logger "console;verbosity=normal"
