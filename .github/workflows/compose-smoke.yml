name: Onboarding smoke

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Docker Compose up and health check
    runs-on: ubuntu-24.04
    # Six images, one carrying the CLI toolchain layer, then two up/down cycles.
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record Docker versions
        run: |
          docker version
          docker compose version

      # Cheap and daemon-free: fails on a wrong ENTRYPOINT assembly, a missing
      # HEALTHCHECK, a root USER, or an image tag that drifted from Compose,
      # before the expensive build starts.
      - name: Check the release image contract
        run: sh scripts/release/release-images.test.sh

      - name: Build, start, and verify the default and distributed stacks
        run: scripts/compose-smoke-test.sh
