name: Onboarding smoke

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Docker Compose up and health check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate container image contracts
        run: |
          scripts/compose-smoke-version.test.sh
          scripts/container-image-contracts.test.sh

      - name: Build, start, and verify onboarding stack
        run: scripts/compose-smoke-test.sh
