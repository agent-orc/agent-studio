name: Onboarding smoke

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Docker Compose up and health check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record Docker versions
        run: |
          docker version
          docker compose version

      - name: Validate container image contracts
        run: |
          bash scripts/compose-bootstrap.test.sh
          bash scripts/compose-smoke-version.test.sh
          bash scripts/container-image-contracts.test.sh
          bash scripts/docker-scenario-images.test.sh

      - name: Build, start, and verify onboarding stack
        run: scripts/compose-smoke-test.sh

      - name: Verify monolith Docker placement
        run: |
          bash scripts/monolith-seed-cli-auth.test.sh
          bash scripts/monolith-compose-smoke.sh

      - name: Verify HTTPS website login and board
        run: WEBSITE_REUSE_MONOLITH_IMAGE=1 bash scripts/monolith-networked-compose-smoke.sh
