name: Onboarding smoke

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Docker Compose up and health check
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record Docker versions
        run: |
          docker version
          docker compose version

      - name: Build, start, and verify onboarding stack
        run: scripts/compose-smoke-test.sh

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The onboarding stack above is the default single-API path. This drives
      # the distributed control plane from the same scenario definition the
      # inproc target uses, so both Compose profiles stay covered.
      - name: Run the deployment regression scenario on the Compose stack
        run: |
          bash scripts/scenario.sh --target compose --level smoke \
            --out artifacts/scenario

      - name: Upload the deployment scenario report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-scenario-report
          path: artifacts/scenario
          if-no-files-found: warn
