name: Container topology smoke

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: onboarding-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Default, distributed, and runner profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record Docker versions
        run: |
          docker version
          docker compose version

      - name: Build, start, and verify all Compose profiles
        run: scripts/compose-smoke-test.sh
