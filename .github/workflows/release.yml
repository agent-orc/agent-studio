name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      mode:
        description: Build a downloadable release candidate without publishing
        type: choice
        options: [release-candidate]
        default: release-candidate

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  version:
    name: Validate release source and version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and repository version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
            test "$(git tag --points-at "$GITHUB_SHA" | grep -Fx "$GITHUB_REF_NAME")" = "$GITHUB_REF_NAME"
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-build-release:
    name: Test and build Linux release
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm 11
        run: |
          npm_version="$(node -p "require('./frontend/package.json').packageManager.replace(/^npm@/, '')")"
          [[ "$npm_version" == 11.* ]]
          npm install --global "npm@$npm_version"
          test "$(npm --version)" = "$npm_version"

      - name: Restore .NET dependencies
        run: dotnet restore agent-taskboard.sln

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Build .NET solution
        run: dotnet build agent-taskboard.sln --configuration Release --no-restore

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test release shell contracts
        run: |
          bash scripts/release/release-scripts.test.sh
          sh scripts/release/linux-install-script.test.sh
          python3 scripts/release/installation-scenarios.test.py
          python3 -m unittest discover \
            -s deploy/agent-host/tests \
            -p 'test_*.py'

      - name: Test .NET solution
        run: >-
          dotnet test agent-taskboard.sln
          --configuration Release
          --no-build
          --filter "Category!=MachineBound"
          --logger "console;verbosity=minimal"

      - name: Test release topology
        run: |
          dotnet test runner.Tests/AgentRunner.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~AgentRunner.Tests.LogShipperCapTests|FullyQualifiedName~AgentRunner.Tests.BoundedOutputBufferTests"
          dotnet test task-server.Tests/TaskServer.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~TaskServer.Tests.TopologyTests|FullyQualifiedName~TaskServer.Tests.ProtocolTests" \
            --logger "console;verbosity=normal"

      - name: Deployment regression scenario (inproc full)
        run: scripts/scenario.sh --target inproc --level full --configuration Release

      - name: Deployment regression scenario (compose full)
        run: >-
          scripts/scenario.sh --target compose --level full
          --configuration Release
          --report-dir artifacts/scenario-reports

      - name: Upload deployment regression scenario reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-regression-scenario-${{ github.sha }}
          path: artifacts/scenario-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Lint and type-check frontend
        working-directory: frontend
        run: |
          npm run lint:ci
          npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm run test:release

      - name: Publish self-contained binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          common=(
            --configuration Release
            --self-contained true
            -p:PublishSingleFile=true
            -p:IncludeNativeLibrariesForSelfExtract=true
            -p:PublishTrimmed=false
            -p:DebugType=None
            -p:DebugSymbols=false
            -p:Version="$VERSION"
            -p:SourceRevisionId="$SHA"
          )
          dotnet publish task-server/TaskServer.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/task-server
          dotnet publish orchestrator-engine/OrchestratorEngine.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/orchestrator-engine
          dotnet publish backend/OrchestratorApi.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/orchestrator-api
          dotnet publish studio-bff/StudioBff.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/studio-bff
          dotnet publish runner/AgentRunner.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/agent-host-linux-x64
          dotnet publish runner/AgentRunner.csproj "${common[@]}" \
            --runtime osx-arm64 --output artifacts/publish/agent-host-osx-arm64
          dotnet publish setup/AgentOrchestratorSetup.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/setup

      - name: Verify published identities and platforms
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          artifacts/publish/task-server/task-server --version | tee /tmp/task-server.version
          artifacts/publish/orchestrator-engine/orchestrator-engine --version | tee /tmp/orchestrator-engine.version
          artifacts/publish/agent-host-linux-x64/agent-host --version | tee /tmp/agent-host.version
          artifacts/publish/setup/agent-studio-setup --version | tee /tmp/setup.version
          grep -F "$VERSION" /tmp/task-server.version
          grep -F "$VERSION" /tmp/orchestrator-engine.version
          grep -F "$VERSION" /tmp/agent-host.version
          grep -F "$VERSION" /tmp/setup.version
          grep -F "$SHA" /tmp/task-server.version
          grep -F "$SHA" /tmp/orchestrator-engine.version
          grep -F "$SHA" /tmp/agent-host.version
          grep -F "$SHA" /tmp/setup.version
          test "$(od -An -tx1 -N4 artifacts/publish/agent-host-linux-x64/agent-host | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N4 artifacts/publish/setup/agent-studio-setup | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N8 artifacts/publish/agent-host-osx-arm64/agent-host | tr -d ' \n')" = 'cffaedfe0c000001'

      - name: Create guided setup executable, install script, four archives, and SHA-256 checksums
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          scripts/release/package-release.sh \
            "${{ needs.version.outputs.version }}" \
            "$GITHUB_SHA" \
            artifacts/publish \
            frontend/dist/frontend/browser \
            artifacts/release

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7

  publish-windows:
    name: Build Windows fallback package (win-x64)
    needs: [version, test-build-release]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Publish win-x64 self-contained binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $common = @(
            '--configuration', 'Release',
            '--runtime', 'win-x64',
            '--self-contained', 'true',
            '-p:PublishSingleFile=true',
            '-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:DebugType=None',
            '-p:DebugSymbols=false',
            "-p:Version=$env:VERSION",
            "-p:SourceRevisionId=$env:SHA"
          )
          dotnet publish task-server/TaskServer.csproj @common --output artifacts/publish/task-server
          if ($LASTEXITCODE -ne 0) { throw 'task-server win-x64 publish failed.' }
          dotnet publish orchestrator-engine/OrchestratorEngine.csproj @common --output artifacts/publish/orchestrator-engine
          if ($LASTEXITCODE -ne 0) { throw 'orchestrator-engine win-x64 publish failed.' }
          dotnet publish studio-bff/StudioBff.csproj @common --output artifacts/publish/studio-bff
          if ($LASTEXITCODE -ne 0) { throw 'studio-bff win-x64 publish failed.' }
          dotnet publish setup/AgentOrchestratorSetup.csproj @common --output artifacts/publish/setup
          if ($LASTEXITCODE -ne 0) { throw 'agent-studio-setup win-x64 publish failed.' }
          dotnet publish runner/AgentRunner.csproj @common --output artifacts/publish/agent-host
          if ($LASTEXITCODE -ne 0) { throw 'agent-host win-x64 publish failed.' }

      - name: Sign Windows setup when a certificate is configured
        if: ${{ env.WINDOWS_CODESIGN_PFX != '' }}
        env:
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'agent-studio-codesign.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX))
          try {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signTool) { throw 'Windows SDK signtool.exe was not found.' }
            & $signTool sign /fd SHA256 /f $certificate /p $env:WINDOWS_CODESIGN_PASSWORD artifacts/publish/setup/agent-studio-setup.exe
            if ($LASTEXITCODE -ne 0) { throw 'Windows setup signing failed.' }
            & $signTool verify /pa artifacts/publish/setup/agent-studio-setup.exe
            if ($LASTEXITCODE -ne 0) { throw 'Windows setup signature verification failed.' }
          } finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }

      - name: Download Linux release artifacts for Studio UI
        uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: linux-release

      - name: Stage Windows setup executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-package -Force | Out-Null
          Copy-Item artifacts/publish/setup/agent-studio-setup.exe windows-package/agent-studio-setup.exe

      - name: Verify published identities
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $checks = @(
            @{ Name = 'task-server'; Path = 'artifacts/publish/task-server/task-server.exe' },
            @{ Name = 'orchestrator-engine'; Path = 'artifacts/publish/orchestrator-engine/orchestrator-engine.exe' },
            @{ Name = 'studio-bff'; Path = 'artifacts/publish/studio-bff/agent-studio-bff.exe' },
            @{ Name = 'agent-host'; Path = 'artifacts/publish/agent-host/agent-host.exe' }
          )
          foreach ($check in $checks) {
            $output = & $check.Path '--version'
            if ($LASTEXITCODE -ne 0) { throw "$($check.Name) --version failed." }
            Write-Host "$($check.Name): $output"
            if ($output -notmatch [regex]::Escape($env:VERSION)) { throw "$($check.Name) does not report version $env:VERSION." }
            if ($output -notmatch [regex]::Escape($env:SHA)) { throw "$($check.Name) does not report SHA $env:SHA." }
          }

      - name: Package the Windows fallback archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          ./scripts/release/package-release-windows.ps1 -Version $env:VERSION -Sha $env:SHA -PublishRoot artifacts/publish -LinuxReleaseRoot linux-release -OutputRoot windows-package

      - name: Test Windows package contents
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead("windows-package/agent-orchestrator-$env:VERSION-win-x64.zip")
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\\', '/') })
            foreach ($file in @('agent-studio-setup.exe', 'agent-host.exe', 'task-server.exe', 'orchestrator-engine.exe', 'studio/browser/index.html')) {
              if (-not ($names -contains "agent-orchestrator-$env:VERSION-win-x64/$file")) { throw "Windows package lacks $file" }
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            windows-package/*.zip
            windows-package/agent-studio-setup.exe
          if-no-files-found: error
          retention-days: 7

  build-images:
    name: Build candidate images without publishing
    needs: [version, test-build-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and save pinned images
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          declare -A dockerfiles=(
            [agent-studio-api]=backend/Dockerfile
            [agent-studio-web]=frontend/Dockerfile
            [agent-task-server]=task-server/Dockerfile
            [agent-orchestrator-engine]=orchestrator-engine/Dockerfile
            [agent-studio-bff]=studio-bff/Dockerfile
            [agent-host]=runner/Dockerfile
            [agent-operations-server]=operations-server/Dockerfile
            [agent-operations-agent]=operations-agent/Dockerfile
          )
          images=()
          for name in "${!dockerfiles[@]}"; do
            image="ghcr.io/agent-orc/$name:v$VERSION"
            docker build -f "${dockerfiles[$name]}" \
              --build-arg VERSION="$VERSION" --build-arg SHA="$SHA" \
              -t "$image" .
            images+=("$image")
          done
          mkdir -p artifacts/images
          docker save "${images[@]}" | zstd -T0 -3 | split -b 1024m - artifacts/images/candidate-images.tar.zst.part-
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-images
          path: artifacts/images/candidate-images.tar.zst.part-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  install-smoke-linux:
    name: Candidate installation scenarios on clean Linux
    needs: [version, test-build-release, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: artifacts/release
      - uses: actions/download-artifact@v4
        with:
          name: candidate-images
          path: artifacts/images
      - name: Load candidate images without publishing
        run: |
          set -euo pipefail
          cat artifacts/images/candidate-images.tar.zst.part-* | zstd -dc | docker load
      - name: Authenticate to the release image registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Find previous published version
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          case "$previous" in
            v*) echo "version=${previous#v}" >> "$GITHUB_OUTPUT" ;;
            ''|null) echo 'version=none' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unexpected previous release tag.' >&2; exit 2 ;;
          esac
      - name: Play candidate installation and first use
        env:
          INSTALL_SCENARIO_OFFLINE: '1'
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
          AGENT_STUDIO_SCENARIO_GIT_REMOTE: ${{ vars.AGENT_STUDIO_SCENARIO_GIT_REMOTE }}
          AGENT_STUDIO_SCENARIO_DEPLOY_KEY: ${{ secrets.AGENT_STUDIO_SCENARIO_DEPLOY_KEY }}
          AGENT_STUDIO_SCENARIO_KNOWN_HOSTS: ${{ secrets.AGENT_STUDIO_SCENARIO_KNOWN_HOSTS }}
        run: |
          chmod +x artifacts/release/agent-studio-setup
          status=0
          for scenario in linux-native linux-docker linux-vm coding-review broken-prerequisites; do
            python3 scripts/release/installation-scenarios.py \
              --scenario "$scenario" --candidate-dir artifacts/release \
              --report-dir artifacts/installation-evidence || status=1
          done
          python3 scripts/release/installation-scenarios.py \
            --scenario upgrade --previous-version "$PREVIOUS_VERSION" \
            --candidate-dir artifacts/release --report-dir artifacts/installation-evidence || status=1
          exit "$status"
      - name: Smoke candidate one-box images
        env:
          COMPOSE_SMOKE_MODE: images
          AGENT_STUDIO_VERSION: ${{ needs.version.outputs.version }}
        run: scripts/compose-smoke-test.sh
      - name: Play docs-only simulated user
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.AGENT_STUDIO_SIMULATED_USER_API_KEY }}
        run: python3 scripts/release/installation-scenarios.py --scenario simulated-user --candidate-dir artifacts/release --report-dir artifacts/installation-evidence
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-linux-${{ github.sha }}
          path: artifacts/installation-evidence/
          if-no-files-found: warn
          retention-days: 30

  install-smoke-windows:
    name: Candidate installation scenarios on clean Windows
    needs: publish-windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: artifacts/release
      - name: Add candidate checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath artifacts/release -File | Where-Object Name -ne 'SHA256SUMS' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath artifacts/release/SHA256SUMS -Encoding ascii
      - name: Play Windows native installation and reinstall
        shell: pwsh
        run: |
          python scripts/release/installation-scenarios.py --scenario windows-native --candidate-dir artifacts/release --report-dir artifacts/installation-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Windows native scenario failed.' }
          python scripts/release/installation-scenarios.py --scenario windows-linux-host --candidate-dir artifacts/release --report-dir artifacts/installation-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Windows cross-host scenario failed.' }
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-windows-${{ github.sha }}
          path: artifacts/installation-evidence/
          if-no-files-found: warn
          retention-days: 30

  install-native-linux-containers:
    name: Native candidate on ${{ matrix.image }}
    needs: test-build-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:13', 'fedora:latest']
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: artifacts/release
      - name: Play native installation as a new Linux user
        env:
          AGENT_STUDIO_SCENARIO_GIT_REMOTE: ${{ vars.AGENT_STUDIO_SCENARIO_GIT_REMOTE }}
          AGENT_STUDIO_SCENARIO_DEPLOY_KEY: ${{ secrets.AGENT_STUDIO_SCENARIO_DEPLOY_KEY }}
          AGENT_STUDIO_SCENARIO_KNOWN_HOSTS: ${{ secrets.AGENT_STUDIO_SCENARIO_KNOWN_HOSTS }}
        run: |
          sh scripts/release/linux-install-script.test.sh
          bash scripts/release/installation-container-probe.sh artifacts/release artifacts/installation-evidence
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-native-${{ strategy.job-index }}-${{ github.sha }}
          path: artifacts/installation-evidence/
          if-no-files-found: warn
          retention-days: 30

  release-candidate:
    name: Assemble downloadable release candidate
    needs: [version, test-build-release, publish-windows, build-images, install-smoke-linux, install-smoke-windows, install-native-linux-containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: artifacts/release
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: artifacts/release
      - name: Extract version notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          scripts/release/extract-release-notes.sh "$VERSION" > artifacts/release/RELEASE-NOTES.md
          grep -q '[^[:space:]]' artifacts/release/RELEASE-NOTES.md
      - name: Recompute and verify complete SHA256SUMS
        run: |
          set -euo pipefail
          chmod +x artifacts/release/agent-studio-setup artifacts/release/install.sh
          (cd artifacts/release && rm -f SHA256SUMS && sha256sum *.tar.gz *.zip agent-studio-setup agent-studio-setup.exe install.sh RELEASE-NOTES.md > SHA256SUMS)
          (cd artifacts/release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30

  publish-images:
    name: Stage tested candidate images by commit SHA
    if: github.event_name == 'push'
    needs: [version, build-images, release-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: candidate-images
          path: artifacts/images
      - name: Load and push immutable candidate image tags
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cat artifacts/images/candidate-images.tar.zst.part-* | zstd -dc | docker load
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          short_sha="${SHA:0:7}"
          for name in agent-studio-api agent-studio-web agent-task-server agent-orchestrator-engine agent-studio-bff agent-host agent-operations-server agent-operations-agent; do
            image="ghcr.io/agent-orc/$name"
            docker tag "$image:v$VERSION" "$image:sha-$short_sha"
            docker push "$image:sha-$short_sha"
          done
          for name in agent-studio-api agent-studio-web agent-task-server agent-orchestrator-engine agent-studio-bff agent-host agent-operations-server agent-operations-agent; do
            image="ghcr.io/agent-orc/$name"
            docker buildx imagetools inspect "$image:sha-$short_sha" >/dev/null
          done

  publish-release:
    name: Publish GitHub Release after every smoke passes
    if: github.event_name == 'push'
    needs: [version, release-candidate, promote-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: artifacts/release
      - name: Verify release assets
        run: (cd artifacts/release && sha256sum -c SHA256SUMS)
      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/release/*.tar.gz
            artifacts/release/*.zip
            artifacts/release/agent-studio-setup
            artifacts/release/agent-studio-setup.exe
            artifacts/release/install.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/release/*.tar.gz artifacts/release/*.zip \
            artifacts/release/agent-studio-setup artifacts/release/agent-studio-setup.exe \
            artifacts/release/install.sh artifacts/release/SHA256SUMS artifacts/release/RELEASE-NOTES.md \
            --verify-tag --notes-file artifacts/release/RELEASE-NOTES.md \
            --title "Agent Studio $VERSION"

  promote-images:
    name: Promote tested images with rollback before release creation
    if: github.event_name == 'push'
    needs: [version, publish-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install regctl for exact digest restore and tag removal
        uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32
        with:
          release: 'v0.11.2'
      - name: Promote the staged images to version and latest tags
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          scripts/release/promote-images.sh "$VERSION" "$SHA"

  verify-visibility:
    name: Report anonymous package visibility after release
    if: github.event_name == 'push'
    needs: [version, publish-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Check anonymous package visibility
        continue-on-error: true
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail
          docker logout ghcr.io
          visibility=public
          for name in agent-studio-api agent-studio-web agent-task-server agent-orchestrator-engine agent-studio-bff agent-host agent-operations-server agent-operations-agent; do
            image="ghcr.io/agent-orc/$name:v$VERSION"
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "$image: anonymous pull available" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "$image: anonymous pull unavailable; set this GHCR package to public" >> "$GITHUB_STEP_SUMMARY"
              visibility=private
            fi
          done
          if [[ "$visibility" == private ]]; then
            echo 'One or more release images require an operator package-visibility change.' >> "$GITHUB_STEP_SUMMARY"
          fi
