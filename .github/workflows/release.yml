name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-release:
    name: Test, build and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and repository version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          version="${GITHUB_REF_NAME#v}"
          test "$(tr -d '\r\n' < VERSION)" = "$version"
          test "$(git tag --points-at "$GITHUB_SHA" | grep -Fx "$GITHUB_REF_NAME")" = "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm 11
        run: |
          npm_version="$(node -p "require('./frontend/package.json').packageManager.replace(/^npm@/, '')")"
          [[ "$npm_version" == 11.* ]]
          npm install --global "npm@$npm_version"
          test "$(npm --version)" = "$npm_version"

      - name: Restore .NET dependencies
        run: dotnet restore agent-taskboard.sln

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Test release shell contracts
        run: |
          bash scripts/release/release-scripts.test.sh
          python3 -m unittest discover \
            -s deploy/agent-host/tests \
            -p 'test_*.py'

      - name: Test .NET solution
        run: >-
          dotnet test agent-taskboard.sln
          --configuration Release
          --no-restore
          --filter "Category!=MachineBound"
          --logger "console;verbosity=minimal"

      - name: Test release topology
        run: |
          dotnet test runner.Tests/AgentRunner.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~AgentRunner.Tests.LogShipperCapTests|FullyQualifiedName~AgentRunner.Tests.BoundedOutputBufferTests"
          dotnet test task-server.Tests/TaskServer.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~TaskServer.Tests.TopologyTests|FullyQualifiedName~TaskServer.Tests.ProtocolTests" \
            --logger "console;verbosity=normal"

      - name: Lint and type-check frontend
        working-directory: frontend
        run: |
          npm run lint:ci
          npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm run test:ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish self-contained binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          common=(
            --configuration Release
            --self-contained true
            -p:PublishSingleFile=true
            -p:IncludeNativeLibrariesForSelfExtract=true
            -p:PublishTrimmed=false
            -p:DebugType=None
            -p:DebugSymbols=false
            -p:Version="$VERSION"
            -p:SourceRevisionId="$SHA"
          )
          dotnet publish task-server/TaskServer.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/task-server
          dotnet publish orchestrator-engine/OrchestratorEngine.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/orchestrator-engine
          dotnet publish runner/AgentRunner.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/agent-host-linux-x64
          dotnet publish runner/AgentRunner.csproj "${common[@]}" \
            --runtime osx-arm64 --output artifacts/publish/agent-host-osx-arm64
          dotnet publish setup/AgentOrchestratorSetup.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/setup

      - name: Verify published identities and platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          artifacts/publish/task-server/task-server --version | tee /tmp/task-server.version
          artifacts/publish/orchestrator-engine/orchestrator-engine --version | tee /tmp/orchestrator-engine.version
          artifacts/publish/agent-host-linux-x64/agent-host --version | tee /tmp/agent-host.version
          artifacts/publish/setup/agent-orchestrator-setup --version | tee /tmp/setup.version
          grep -F "$VERSION" /tmp/task-server.version
          grep -F "$VERSION" /tmp/orchestrator-engine.version
          grep -F "$VERSION" /tmp/agent-host.version
          grep -F "$VERSION" /tmp/setup.version
          grep -F "$SHA" /tmp/task-server.version
          grep -F "$SHA" /tmp/orchestrator-engine.version
          grep -F "$SHA" /tmp/agent-host.version
          grep -F "$SHA" /tmp/setup.version
          test "$(od -An -tx1 -N4 artifacts/publish/agent-host-linux-x64/agent-host | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N4 artifacts/publish/setup/agent-orchestrator-setup | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N8 artifacts/publish/agent-host-osx-arm64/agent-host | tr -d ' \n')" = 'cffaedfe0c000001'

      - name: Create guided setup executable, three archives, and SHA-256 checksums
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          scripts/release/package-release.sh \
            "${{ steps.version.outputs.version }}" \
            "$GITHUB_SHA" \
            artifacts/publish \
            frontend/dist/frontend/browser \
            artifacts/release

      - name: Build and publish six release images
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          SHA: ${{ github.sha }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          declare -A dockerfiles=(
            [agent-studio-api]=backend/Dockerfile
            [agent-studio-web]=frontend/Dockerfile
            [agent-task-server]=task-server/Dockerfile
            [agent-orchestrator-engine]=orchestrator-engine/Dockerfile
            [agent-studio-bff]=studio-bff/Dockerfile
            [agent-host]=runner/Dockerfile
          )
          for image in "${!dockerfiles[@]}"; do
            identity="$image/$VERSION+sha.$SHA"
            if [ "$image" = agent-task-server ]; then
              identity="task-server $VERSION+sha.$SHA"
            elif [ "$image" = agent-host ]; then
              identity="agent-host $VERSION+sha.$SHA"
            fi
            docker build --platform linux/amd64 \
              --build-arg VERSION="$VERSION" \
              --build-arg COMMIT="$SHA" \
              --build-arg BUILD_IDENTITY="$identity" \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -f "${dockerfiles[$image]}" \
              -t "ghcr.io/agent-orc/$image:v$VERSION" \
              -t "ghcr.io/agent-orc/$image:sha-$SHORT_SHA" .
            docker push "ghcr.io/agent-orc/$image:v$VERSION"
            docker push "ghcr.io/agent-orc/$image:sha-$SHORT_SHA"
          done
          docker logout ghcr.io

      - name: Verify image identities, runtime users, health checks, and sizes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT_SHA: ${{ steps.version.outputs.short_sha }}
          SHA: ${{ github.sha }}
        run: |
          : > artifacts/release/container-images.txt
          for image in agent-studio-api agent-studio-web agent-task-server agent-orchestrator-engine agent-studio-bff agent-host; do
            ref="ghcr.io/agent-orc/$image:v$VERSION"
            immutable_ref="ghcr.io/agent-orc/$image:sha-$SHORT_SHA"
            docker pull "$ref"
            docker pull "$immutable_ref"
            version_digest="$(docker image inspect "$ref" --format '{{ index .RepoDigests 0 }}' | cut -d@ -f2)"
            sha_digest="$(docker image inspect "$immutable_ref" --format '{{ index .RepoDigests 0 }}' | cut -d@ -f2)"
            test -n "$version_digest"
            test "$version_digest" = "$sha_digest"
            test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
            test "$(docker image inspect "$ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SHA"
            user="$(docker image inspect "$ref" --format '{{ .Config.User }}')"
            test -n "$user"
            test "$user" != root
            test "$user" != 0
            test "$(docker image inspect "$ref" --format '{{ if .Config.Healthcheck }}yes{{ end }}')" = yes
            bytes="$(docker image inspect "$ref" --format '{{ .Size }}')"
            printf '%s %s digest=%s bytes=%s user=%s\n' "$image" "sha-$SHORT_SHA" "$version_digest" "$bytes" "$user" | tee -a artifacts/release/container-images.txt
          done
          {
            echo '### Container image report'
            echo '```text'
            cat artifacts/release/container-images.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          (cd artifacts/release && sha256sum container-images.txt >> SHA256SUMS)
          docker run --rm "ghcr.io/agent-orc/agent-task-server:v$VERSION" --version | grep -F "task-server $VERSION+sha.$SHA"
          docker run --rm --entrypoint dotnet "ghcr.io/agent-orc/agent-host:v$VERSION" \
            /opt/agent-host/agent-host.dll --version | grep -F "agent-host $VERSION+sha.$SHA"

      - name: Smoke-test published image topology
        env:
          AGENT_STUDIO_VERSION: v${{ steps.version.outputs.version }}
        run: scripts/compose-smoke-test.sh

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/release/*.tar.gz
            artifacts/release/agent-orchestrator-setup

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/release/*.tar.gz
          artifacts/release/agent-orchestrator-setup
          artifacts/release/container-images.txt
          artifacts/release/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Agent Studio ${{ steps.version.outputs.version }}"
