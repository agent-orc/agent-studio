name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-build-release:
    name: Test, build and publish release
    runs-on: ubuntu-24.04
    # Six service images, one of which carries the whole CLI toolchain layer.
    timeout-minutes: 120
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and repository version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          version="${GITHUB_REF_NAME#v}"
          test "$(tr -d '\r\n' < VERSION)" = "$version"
          test "$(git tag --points-at "$GITHUB_SHA" | grep -Fx "$GITHUB_REF_NAME")" = "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          # docker-compose.yml pins the image tag new users pull by default. It
          # cannot read VERSION, so assert here that the two never drift apart.
          grep -q "AGENT_STUDIO_VERSION:-v$version" docker-compose.yml
          grep -q "^AGENT_STUDIO_VERSION=v$version$" .env.example
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm 11
        run: |
          npm_version="$(node -p "require('./frontend/package.json').packageManager.replace(/^npm@/, '')")"
          [[ "$npm_version" == 11.* ]]
          npm install --global "npm@$npm_version"
          test "$(npm --version)" = "$npm_version"

      - name: Restore .NET dependencies
        run: dotnet restore agent-taskboard.sln

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Test release shell contracts
        run: |
          bash scripts/release/release-scripts.test.sh
          python3 -m unittest discover \
            -s deploy/agent-host/tests \
            -p 'test_*.py'

      - name: Test .NET solution
        run: >-
          dotnet test agent-taskboard.sln
          --configuration Release
          --no-restore
          --filter "Category!=MachineBound"
          --logger "console;verbosity=minimal"

      - name: Test release topology
        run: |
          dotnet test runner.Tests/AgentRunner.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~AgentRunner.Tests.LogShipperCapTests|FullyQualifiedName~AgentRunner.Tests.BoundedOutputBufferTests"
          dotnet test task-server.Tests/TaskServer.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~TaskServer.Tests.TopologyTests|FullyQualifiedName~TaskServer.Tests.ProtocolTests" \
            --logger "console;verbosity=normal"

      - name: Lint and type-check frontend
        working-directory: frontend
        run: |
          npm run lint:ci
          npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm run test:ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish self-contained binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          common=(
            --configuration Release
            --self-contained true
            -p:PublishSingleFile=true
            -p:IncludeNativeLibrariesForSelfExtract=true
            -p:PublishTrimmed=false
            -p:DebugType=None
            -p:DebugSymbols=false
            -p:Version="$VERSION"
            -p:SourceRevisionId="$SHA"
          )
          dotnet publish task-server/TaskServer.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/task-server
          dotnet publish orchestrator-engine/OrchestratorEngine.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/orchestrator-engine
          dotnet publish runner/AgentRunner.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/agent-host-linux-x64
          dotnet publish runner/AgentRunner.csproj "${common[@]}" \
            --runtime osx-arm64 --output artifacts/publish/agent-host-osx-arm64
          dotnet publish setup/AgentOrchestratorSetup.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/setup

      - name: Verify published identities and platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          artifacts/publish/task-server/task-server --version | tee /tmp/task-server.version
          artifacts/publish/orchestrator-engine/orchestrator-engine --version | tee /tmp/orchestrator-engine.version
          artifacts/publish/agent-host-linux-x64/agent-host --version | tee /tmp/agent-host.version
          artifacts/publish/setup/agent-orchestrator-setup --version | tee /tmp/setup.version
          grep -F "$VERSION" /tmp/task-server.version
          grep -F "$VERSION" /tmp/orchestrator-engine.version
          grep -F "$VERSION" /tmp/agent-host.version
          grep -F "$VERSION" /tmp/setup.version
          grep -F "$SHA" /tmp/task-server.version
          grep -F "$SHA" /tmp/orchestrator-engine.version
          grep -F "$SHA" /tmp/agent-host.version
          grep -F "$SHA" /tmp/setup.version
          test "$(od -An -tx1 -N4 artifacts/publish/agent-host-linux-x64/agent-host | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N4 artifacts/publish/setup/agent-orchestrator-setup | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N8 artifacts/publish/agent-host-osx-arm64/agent-host | tr -d ' \n')" = 'cffaedfe0c000001'

      - name: Create guided setup executable, three archives, and SHA-256 checksums
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          scripts/release/package-release.sh \
            "${{ steps.version.outputs.version }}" \
            "$GITHUB_SHA" \
            artifacts/publish \
            frontend/dist/frontend/browser \
            artifacts/release

      - name: Publish pinned service images
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHORT: ${{ steps.version.outputs.short }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          created="$(git show -s --format=%cI "$SHA")"
          # Read the list up front: docker reads stdin, so it must not share the
          # loop's input.
          mapfile -t entries < <(grep -v '^[[:space:]]*#' .github/release-images.txt | grep -v '^[[:space:]]*$')
          test "${#entries[@]}" -eq 6
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for entry in "${entries[@]}"; do
            read -r name dockerfile <<<"$entry"
            repo="ghcr.io/agent-orc/$name"
            # linux/amd64 only, which is the runner's native architecture. The
            # runner image carries the CLI toolchain, so cross-building it under
            # emulation would not stay inside the job budget.
            docker build -f "$dockerfile" \
              --build-arg VERSION="$VERSION" \
              --build-arg REVISION="$SHA" \
              --label "org.opencontainers.image.created=$created" \
              -t "$repo:v$VERSION" \
              -t "$repo:sha-$SHORT" .
            docker push "$repo:v$VERSION"
            docker push "$repo:sha-$SHORT"
          done
          docker logout ghcr.io

      - name: Verify image labels, build identity, and non-root user
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHORT: ${{ steps.version.outputs.short }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t entries < <(grep -v '^[[:space:]]*#' .github/release-images.txt | grep -v '^[[:space:]]*$')
          # Re-pull so the assertions read what the registry actually serves, not
          # the local build cache.
          for entry in "${entries[@]}"; do
            read -r name _ <<<"$entry"
            repo="ghcr.io/agent-orc/$name"
            docker image rm "$repo:v$VERSION" "$repo:sha-$SHORT"
            docker pull "$repo:v$VERSION"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$repo:v$VERSION")" = "$VERSION"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$repo:v$VERSION")" = "$SHA"
            user="$(docker image inspect --format '{{.Config.User}}' "$repo:v$VERSION")"
            test -n "$user"
            test "$user" != "root"
            test "$user" != "0"
            test -n "$(docker image inspect --format '{{if .Config.Healthcheck}}set{{end}}' "$repo:v$VERSION")"
            printf 'image=%s user=%s\n' "$repo:v$VERSION" "$user"
          done
          # The binaries stay the source of truth for build identity, so the
          # label is only trusted once the process inside the image agrees.
          for entry in \
            "agent-task-server task-server.dll" \
            "agent-orchestrator-engine orchestrator-engine.dll" \
            "agent-host /opt/agent-host/agent-host.dll"; do
            read -r image assembly <<<"$entry"
            reported="$(docker run --rm --entrypoint dotnet "ghcr.io/agent-orc/$image:v$VERSION" "$assembly" --version)"
            printf '%s: %s\n' "$image" "$reported"
            grep -F "$VERSION" <<<"$reported"
            grep -F "$SHA" <<<"$reported"
          done

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/release/*.tar.gz
            artifacts/release/agent-orchestrator-setup

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/release/*.tar.gz
          artifacts/release/agent-orchestrator-setup
          artifacts/release/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Agent Studio ${{ steps.version.outputs.version }}"
