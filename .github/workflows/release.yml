name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate tag and repository version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and repository version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]
          version="${GITHUB_REF_NAME#v}"
          test "$(tr -d '\r\n' < VERSION)" = "$version"
          test "$(git tag --points-at "$GITHUB_SHA" | grep -Fx "$GITHUB_REF_NAME")" = "$GITHUB_REF_NAME"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-build-release:
    name: Test, build and publish Linux release
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pin npm 11
        run: |
          npm_version="$(node -p "require('./frontend/package.json').packageManager.replace(/^npm@/, '')")"
          [[ "$npm_version" == 11.* ]]
          npm install --global "npm@$npm_version"
          test "$(npm --version)" = "$npm_version"

      - name: Restore .NET dependencies
        run: dotnet restore agent-taskboard.sln

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Test release shell contracts
        run: |
          bash scripts/release/release-scripts.test.sh
          python3 scripts/release/installation-scenarios.test.py
          python3 -m unittest discover \
            -s deploy/agent-host/tests \
            -p 'test_*.py'

      - name: Test .NET solution
        run: >-
          dotnet test agent-taskboard.sln
          --configuration Release
          --no-restore
          --filter "Category!=MachineBound"
          --logger "console;verbosity=minimal"

      - name: Test release topology
        run: |
          dotnet test runner.Tests/AgentRunner.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~AgentRunner.Tests.LogShipperCapTests|FullyQualifiedName~AgentRunner.Tests.BoundedOutputBufferTests"
          dotnet test task-server.Tests/TaskServer.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~TaskServer.Tests.TopologyTests|FullyQualifiedName~TaskServer.Tests.ProtocolTests" \
            --logger "console;verbosity=normal"

      - name: Deployment regression scenario (inproc full)
        run: scripts/scenario.sh --target inproc --level full --configuration Release

      - name: Deployment regression scenario (compose full)
        run: >-
          scripts/scenario.sh --target compose --level full
          --configuration Release
          --report-dir artifacts/scenario-reports

      - name: Upload deployment regression scenario reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-regression-scenario-${{ github.sha }}
          path: artifacts/scenario-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Lint and type-check frontend
        working-directory: frontend
        run: |
          npm run lint:ci
          npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm run test:release

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish self-contained binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          common=(
            --configuration Release
            --self-contained true
            -p:PublishSingleFile=true
            -p:IncludeNativeLibrariesForSelfExtract=true
            -p:PublishTrimmed=false
            -p:DebugType=None
            -p:DebugSymbols=false
            -p:Version="$VERSION"
            -p:SourceRevisionId="$SHA"
          )
          dotnet publish task-server/TaskServer.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/task-server
          dotnet publish orchestrator-engine/OrchestratorEngine.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/orchestrator-engine
          dotnet publish runner/AgentRunner.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/agent-host-linux-x64
          dotnet publish runner/AgentRunner.csproj "${common[@]}" \
            --runtime osx-arm64 --output artifacts/publish/agent-host-osx-arm64
          dotnet publish setup/AgentOrchestratorSetup.csproj "${common[@]}" \
            --runtime linux-x64 --output artifacts/publish/setup

      - name: Verify published identities and platforms
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          artifacts/publish/task-server/task-server --version | tee /tmp/task-server.version
          artifacts/publish/orchestrator-engine/orchestrator-engine --version | tee /tmp/orchestrator-engine.version
          artifacts/publish/agent-host-linux-x64/agent-host --version | tee /tmp/agent-host.version
          artifacts/publish/setup/agent-studio-setup --version | tee /tmp/setup.version
          grep -F "$VERSION" /tmp/task-server.version
          grep -F "$VERSION" /tmp/orchestrator-engine.version
          grep -F "$VERSION" /tmp/agent-host.version
          grep -F "$VERSION" /tmp/setup.version
          grep -F "$SHA" /tmp/task-server.version
          grep -F "$SHA" /tmp/orchestrator-engine.version
          grep -F "$SHA" /tmp/agent-host.version
          grep -F "$SHA" /tmp/setup.version
          test "$(od -An -tx1 -N4 artifacts/publish/agent-host-linux-x64/agent-host | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N4 artifacts/publish/setup/agent-studio-setup | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N8 artifacts/publish/agent-host-osx-arm64/agent-host | tr -d ' \n')" = 'cffaedfe0c000001'

      - name: Create guided setup executable, four archives, and SHA-256 checksums
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          scripts/release/package-release.sh \
            "${{ needs.version.outputs.version }}" \
            "$GITHUB_SHA" \
            artifacts/publish \
            frontend/dist/frontend/browser \
            artifacts/release

      - name: Publish pinned release images
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short_sha="${SHA:0:7}"
          declare -A dockerfiles=(
            [agent-studio-api]=backend/Dockerfile
            [agent-studio-web]=frontend/Dockerfile
            [agent-task-server]=task-server/Dockerfile
            [agent-orchestrator-engine]=orchestrator-engine/Dockerfile
            [agent-studio-bff]=studio-bff/Dockerfile
            [agent-host]=runner/Dockerfile
            [agent-operations-server]=operations-server/Dockerfile
            [agent-operations-agent]=operations-agent/Dockerfile
          )
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for name in "${!dockerfiles[@]}"; do
            image="ghcr.io/agent-orc/$name"
            docker build -f "${dockerfiles[$name]}" \
              --build-arg VERSION="$VERSION" \
              --build-arg SHA="$SHA" \
              -t "$image:v$VERSION" \
              -t "$image:sha-$short_sha" \
              -t "$image:latest" \
              .
            docker push "$image:v$VERSION"
            docker push "$image:sha-$short_sha"
            docker push "$image:latest"
          done
          docker logout ghcr.io
          for name in "${!dockerfiles[@]}"; do
            image="ghcr.io/agent-orc/$name"
            docker image rm "$image:v$VERSION" "$image:sha-$short_sha" "$image:latest"
            docker pull "$image:v$VERSION"
            docker pull "$image:sha-$short_sha"
          done
          echo "image size report (v$VERSION):"
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' \
            | grep "ghcr.io/agent-orc/" | grep ":v$VERSION"

      - name: Smoke published one-box images
        env:
          COMPOSE_SMOKE_MODE: images
          AGENT_STUDIO_VERSION: ${{ needs.version.outputs.version }}
        run: scripts/compose-smoke-test.sh

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-artifacts
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7

  publish-windows:
    name: Publish Windows fallback package (win-x64)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Studio browser bundle
        shell: pwsh
        run: |
          $npmVersion = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).packageManager.Replace('npm@', '')
          npm install --global "npm@$npmVersion"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned npm install failed.' }
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend dependency install failed.' }
          npm --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed.' }

      - name: Publish win-x64 self-contained binaries
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $common = @(
            '--configuration', 'Release',
            '--runtime', 'win-x64',
            '--self-contained', 'true',
            '-p:PublishSingleFile=true',
            '-p:IncludeNativeLibrariesForSelfExtract=true',
            '-p:DebugType=None',
            '-p:DebugSymbols=false',
            '-p:Version=' + $env:VERSION,
            '-p:SourceRevisionId=' + $env:SHA
          )
          dotnet publish task-server/TaskServer.csproj @common --output artifacts/publish/task-server
          if ($LASTEXITCODE -ne 0) { throw 'task-server win-x64 publish failed.' }
          dotnet publish orchestrator-engine/OrchestratorEngine.csproj @common --output artifacts/publish/orchestrator-engine
          if ($LASTEXITCODE -ne 0) { throw 'orchestrator-engine win-x64 publish failed.' }
          dotnet publish studio-bff/StudioBff.csproj @common --output artifacts/publish/studio-bff
          if ($LASTEXITCODE -ne 0) { throw 'studio-bff win-x64 publish failed.' }
          dotnet publish backend/OrchestratorApi.csproj @common --output artifacts/publish/studio-backend
          if ($LASTEXITCODE -ne 0) { throw 'studio backend win-x64 publish failed.' }
          dotnet publish runner/AgentRunner.csproj @common --output artifacts/publish/agent-host
          if ($LASTEXITCODE -ne 0) { throw 'agent host win-x64 publish failed.' }
          dotnet publish setup/AgentOrchestratorSetup.csproj @common --output artifacts/publish/setup
          if ($LASTEXITCODE -ne 0) { throw 'agent-studio-setup win-x64 publish failed.' }

      - name: Sign Windows setup when a certificate is configured
        if: ${{ env.WINDOWS_CODESIGN_PFX != '' }}
        env:
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'agent-studio-codesign.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX))
          try {
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signTool) { throw 'Windows SDK signtool.exe was not found.' }
            & $signTool sign /fd SHA256 /f $certificate /p $env:WINDOWS_CODESIGN_PASSWORD artifacts/publish/setup/agent-studio-setup.exe
            if ($LASTEXITCODE -ne 0) { throw 'Windows setup signing failed.' }
            & $signTool verify /pa artifacts/publish/setup/agent-studio-setup.exe
            if ($LASTEXITCODE -ne 0) { throw 'Windows setup signature verification failed.' }
          } finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
          }

      - name: Stage Windows setup executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows-package -Force | Out-Null
          Copy-Item artifacts/publish/setup/agent-studio-setup.exe windows-package/agent-studio-setup.exe

      - name: Verify published identities
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $checks = @(
            @{ Name = 'task-server'; Path = 'artifacts/publish/task-server/task-server.exe' },
            @{ Name = 'orchestrator-engine'; Path = 'artifacts/publish/orchestrator-engine/orchestrator-engine.exe' },
            @{ Name = 'studio-bff'; Path = 'artifacts/publish/studio-bff/agent-studio-bff.exe' }
          )
          foreach ($check in $checks) {
            $output = & $check.Path '--version'
            if ($LASTEXITCODE -ne 0) { throw "$($check.Name) --version failed." }
            Write-Host "$($check.Name): $output"
            if ($output -notmatch [regex]::Escape($env:VERSION)) { throw "$($check.Name) does not report version $env:VERSION." }
            if ($output -notmatch [regex]::Escape($env:SHA)) { throw "$($check.Name) does not report SHA $env:SHA." }
          }

      - name: Package the Windows fallback archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $component = "agent-orchestrator-$env:VERSION-win-x64"
          $root = "windows-package/$component"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item artifacts/publish/task-server/task-server.exe $root
          Copy-Item artifacts/publish/orchestrator-engine/orchestrator-engine.exe $root
          Copy-Item artifacts/publish/studio-bff/agent-studio-bff.exe $root
          Copy-Item artifacts/publish/studio-backend/OrchestratorApi.exe $root
          Copy-Item artifacts/publish/agent-host/agent-host.exe $root
          Copy-Item artifacts/publish/agent-host/agent-host.exe $root/provider-codex.exe
          Copy-Item artifacts/publish/agent-host/agent-host.exe $root/provider-claude.exe
          Copy-Item artifacts/publish/studio-backend/appsettings.json $root
          if (Test-Path artifacts/publish/studio-backend/prompts) {
            Copy-Item artifacts/publish/studio-backend/prompts $root/prompts -Recurse
          }
          Copy-Item agent-rules $root/agent-rules -Recurse
          $browser = if (Test-Path frontend/dist/frontend/browser/index.html) { 'frontend/dist/frontend/browser' } else { 'frontend/dist/frontend' }
          if (-not (Test-Path (Join-Path $browser 'index.html'))) { throw 'Studio browser bundle is missing.' }
          Copy-Item $browser $root/browser -Recurse
          Copy-Item deploy/windows $root/deploy-windows -Recurse
          New-Item -ItemType Directory -Path "$root/config" -Force | Out-Null
          Copy-Item deploy/release/agent-orchestrator/config/*.template "$root/config/"
          Set-Content -LiteralPath "$root/VERSION" -Value $env:VERSION -NoNewline -Encoding ascii
          Set-Content -LiteralPath "$root/RELEASE-SHA" -Value $env:SHA -NoNewline -Encoding ascii
          @(
            'component=agent-orchestrator',
            "version=$env:VERSION",
            "gitSha=$env:SHA",
            'runtimeIdentifiers=win-x64',
            'protocolMinimum=1',
            'protocolMaximum=2'
          ) | Set-Content -LiteralPath "$root/RELEASE" -Encoding ascii
          Compress-Archive -Path $root -DestinationPath "windows-package/$component.zip"

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            windows-package/*.zip
            windows-package/agent-studio-setup.exe
          if-no-files-found: error
          retention-days: 7

  install-smoke-linux:
    name: Candidate installation scenarios on clean Linux
    needs: test-build-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: artifacts/release
      - name: Authenticate to the release image registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Find previous published version
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          case "$previous" in
            v*) echo "version=${previous#v}" >> "$GITHUB_OUTPUT" ;;
            ''|null) echo 'version=none' >> "$GITHUB_OUTPUT" ;;
            *) echo 'Unexpected previous release tag.' >&2; exit 2 ;;
          esac
      - name: Play candidate installation and first use
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
          AGENT_STUDIO_SCENARIO_GIT_REMOTE: ${{ vars.AGENT_STUDIO_SCENARIO_GIT_REMOTE }}
          AGENT_STUDIO_SCENARIO_DEPLOY_KEY: ${{ secrets.AGENT_STUDIO_SCENARIO_DEPLOY_KEY }}
          AGENT_STUDIO_SCENARIO_KNOWN_HOSTS: ${{ secrets.AGENT_STUDIO_SCENARIO_KNOWN_HOSTS }}
        run: |
          chmod +x artifacts/release/agent-studio-setup
          status=0
          for scenario in linux-native linux-docker linux-vm coding-review broken-prerequisites; do
            python3 scripts/release/installation-scenarios.py \
              --scenario "$scenario" --candidate-dir artifacts/release \
              --report-dir artifacts/installation-evidence || status=1
          done
          python3 scripts/release/installation-scenarios.py \
            --scenario upgrade --previous-version "$PREVIOUS_VERSION" \
            --candidate-dir artifacts/release --report-dir artifacts/installation-evidence || status=1
          exit "$status"
      - name: Play docs-only simulated user
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.AGENT_STUDIO_SIMULATED_USER_API_KEY }}
        run: python3 scripts/release/installation-scenarios.py --scenario simulated-user --candidate-dir artifacts/release --report-dir artifacts/installation-evidence
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-linux-${{ github.sha }}
          path: artifacts/installation-evidence/
          if-no-files-found: warn
          retention-days: 30

  install-smoke-windows:
    name: Candidate installation scenarios on clean Windows
    needs: publish-windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: artifacts/release
      - name: Add candidate checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath artifacts/release -File | Where-Object Name -ne 'SHA256SUMS' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath artifacts/release/SHA256SUMS -Encoding ascii
      - name: Verify executable identity and help
        shell: pwsh
        run: |
          $setup = 'artifacts/release/agent-studio-setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw 'Windows setup executable is missing.' }
          $version = & $setup --version
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^agent-studio-setup ') { throw 'Windows setup version check failed.' }
          $helpText = & $setup --help
          if ($LASTEXITCODE -ne 0 -or ($helpText -join "`n") -notmatch 'rollback') { throw 'Windows setup help check failed.' }
      - name: Test packaged provider bridge with a fake CLI
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/release -Filter '*-win-x64.zip' | Select-Object -First 1
          $expanded = Join-Path $env:RUNNER_TEMP 'studio-provider-bridge'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded
          $bridge = Get-ChildItem $expanded -Filter provider-codex.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $bridge) { throw 'Packaged Codex provider bridge is missing.' }
          $fake = Join-Path $env:RUNNER_TEMP 'fake-codex.js'
          Set-Content -LiteralPath $fake -Value 'process.stdout.write("fake-codex " + process.argv.slice(2).join(" "))' -Encoding ascii
          $env:AGENT_STUDIO_NODE_EXE = (Get-Command node.exe).Source
          $env:AGENT_STUDIO_CODEX_JS = $fake
          $output = & $bridge '--version'
          if ($LASTEXITCODE -ne 0 -or $output -ne 'fake-codex --version') { throw 'Provider bridge did not forward arguments to node.exe.' }
      # The hosted Windows runner has no Linux container engine, so it proves
      # the native path: the checksum-verified win-x64 package installed as
      # the D6 scheduled tasks, health, uninstall keeping data, and purge.
      - name: Install, verify, uninstall, and purge the native services
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path artifacts/release).Path
          $setup = Join-Path $release 'agent-studio-setup.exe'
          Get-ChildItem -LiteralPath $release -File -Filter '*.zip' | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -LiteralPath (Join-Path $release 'SHA256SUMS') -Encoding ascii
          $installDir = Join-Path $env:RUNNER_TEMP 'agent-studio-native'
          $data = Join-Path $installDir 'data'
          $tasks = 'AgentOrchestrator-TaskServer', 'AgentOrchestrator-Engine', 'AgentOrchestrator-StudioConnector', 'AgentOrchestrator-StudioBackend', 'AgentOrchestrator-Runner'
          function Invoke-Setup { & $setup @args; if ($LASTEXITCODE -ne 0) { throw "agent-studio-setup $args failed." } }
          function Assert-Healthy {
            $ready = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5071/readyz
            if ($ready.Content -notmatch '"status":"ready"' -or $ready.Content -notmatch '"mode":"Normal"') { throw "Task Server not ready: $($ready.Content)" }
            $live = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:5031/healthz
            if ($live.StatusCode -ne 200) { throw "Studio backend not live: $($live.Content)" }
            $edge = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4011/healthz
            if ($edge.Content -notmatch '"status":"live"') { throw "Studio edge not live: $($edge.Content)" }
            $ui = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4011/
            if ($ui.Content -notmatch '<html') { throw 'Studio browser bundle was not served.' }
            $auth = Invoke-RestMethod http://127.0.0.1:4011/api/v1/studio/auth/status
            if (-not $auth.bootstrapRequired -or -not $auth.bootstrapCodeRequired) { throw 'Owner bootstrap code is not armed.' }
            $code = Join-Path $env:ProgramData 'AgentOrchestrator\owner-bootstrap.code'
            if (-not (Test-Path $code) -or (Get-Content $code -Raw).Trim().Length -lt 32) { throw 'Owner bootstrap code file is missing.' }
            $runnerToken = (Get-Content (Join-Path $env:ProgramData 'AgentOrchestrator\runner.token') -Raw).Trim()
            $registered = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $runners = Invoke-RestMethod -Headers @{ Authorization = "Bearer $runnerToken" } http://127.0.0.1:5071/api/v1/runners
              if (($runners | ConvertTo-Json -Depth 8) -match 'local-coding') { $registered = $true; break }
              Start-Sleep -Seconds 2
            }
            if (-not $registered) { throw 'Local runner did not register within 60 seconds.' }
          }
          function Assert-Tasks([bool] $present) {
            foreach ($task in $tasks) {
              $found = $null -ne (Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue)
              if ($found -ne $present) { throw "$task registered=$found, expected $present." }
            }
          }

          $answers = Join-Path $env:RUNNER_TEMP 'studio-answers.json'
          @{ Target = 'native'; ReleaseDirectory = $release; InstallDirectory = $installDir; ProviderCli = 'skip'; GitAccess = 'skip' } |
            ConvertTo-Json | Set-Content -LiteralPath $answers -Encoding utf8
          Invoke-Setup --unattended --answer-file $answers
          Assert-Tasks $true
          Assert-Healthy
          Invoke-Setup --unattended --answer-file $answers
          Assert-Tasks $true
          Assert-Healthy

          Invoke-Setup uninstall --install-dir $installDir
          Assert-Tasks $false
          if (-not (Test-Path -LiteralPath $data)) { throw 'Uninstall without --purge removed the task data.' }
          if (-not (Test-Path -LiteralPath "$env:ProgramData\AgentOrchestrator\server.env")) { throw 'Uninstall without --purge removed the configuration.' }

          Invoke-Setup --unattended --answer-file $answers
          Assert-Healthy
          $ownerCode = (Get-Content (Join-Path $env:ProgramData 'AgentOrchestrator\owner-bootstrap.code') -Raw).Trim()
          $ownerPassword = 'ci-' + [guid]::NewGuid().ToString('N')
          $ownerRequest = @{ username = 'ci-owner'; password = $ownerPassword; displayName = 'CI Owner'; bootstrapCode = $ownerCode } | ConvertTo-Json
          $ownerSession = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:4011/api/v1/studio/auth/bootstrap `
            -Headers @{ Origin = 'http://127.0.0.1:4011' } -ContentType 'application/json' -Body $ownerRequest
          if (-not $ownerSession.status.authenticated) { throw 'Owner bootstrap did not create an authenticated session.' }
          Invoke-Setup uninstall --install-dir $installDir --purge
          Assert-Tasks $false
          if (Test-Path -LiteralPath $data) { throw 'Purge left the task data.' }
          if (Test-Path -LiteralPath "$env:ProgramData\AgentOrchestrator") { throw 'Purge left the configuration.' }
      - name: Play installation scenarios
        shell: pwsh
        run: |
          python scripts/release/installation-scenarios.py --scenario windows-native --candidate-dir artifacts/release --report-dir artifacts/installation-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Windows native scenario failed.' }
          python scripts/release/installation-scenarios.py --scenario windows-linux-host --candidate-dir artifacts/release --report-dir artifacts/installation-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Windows cross-host scenario failed.' }
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-windows-${{ github.sha }}
          path: artifacts/installation-evidence/
          if-no-files-found: warn
          retention-days: 30

  install-native-linux-containers:
    name: Native candidate on ${{ matrix.image }}
    needs: test-build-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:13', 'fedora:latest']
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: artifacts/release
      - name: Play native installation as a new Linux user
        env:
          AGENT_STUDIO_SCENARIO_GIT_REMOTE: ${{ vars.AGENT_STUDIO_SCENARIO_GIT_REMOTE }}
          AGENT_STUDIO_SCENARIO_DEPLOY_KEY: ${{ secrets.AGENT_STUDIO_SCENARIO_DEPLOY_KEY }}
          AGENT_STUDIO_SCENARIO_KNOWN_HOSTS: ${{ secrets.AGENT_STUDIO_SCENARIO_KNOWN_HOSTS }}
        run: bash scripts/release/installation-container-probe.sh artifacts/release artifacts/installation-evidence
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-native-${{ strategy.job-index }}-${{ github.sha }}
          path: artifacts/installation-evidence/
          if-no-files-found: warn
          retention-days: 30

  publish-release:
    name: Merge artifacts and publish the GitHub Release
    needs: [version, test-build-release, publish-windows, install-smoke-linux, install-smoke-windows, install-native-linux-containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Linux release artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-artifacts
          path: artifacts/release

      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: artifacts/release

      - name: Recompute the combined SHA256SUMS
        run: |
          chmod +x artifacts/release/agent-studio-setup
          (cd artifacts/release && rm -f SHA256SUMS && sha256sum * > SHA256SUMS)
          (cd artifacts/release && sha256sum -c SHA256SUMS)

      - name: Attest release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/release/*.tar.gz
            artifacts/release/*.zip
            artifacts/release/agent-studio-setup
            artifacts/release/agent-studio-setup.exe

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/release/*.tar.gz
          artifacts/release/*.zip
          artifacts/release/agent-studio-setup
          artifacts/release/agent-studio-setup.exe
          artifacts/release/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "Agent Studio ${{ needs.version.outputs.version }}"
