# One-box installation: Task Server is the only task authority. Run
# scripts/compose-distributed-bootstrap.sh before the first `docker compose up`.
# The legacy API and runner pair remain available only with --profile legacy
# while older UI routes migrate to the standalone Task Server.
# --profile dev:            source-built "-dev" siblings of every service
#                          above, for contributors iterating on this checkout.
#                          Build is intentionally never wired to the default,
#                          release-image services - only the "dev"
#                          profile ever triggers `build:`. Name the exact
#                          "-dev" services you want on the command line
#                          (e.g. `docker compose --profile dev up --build
#                          task-server-dev studio-bff-dev frontend-dev`); a bare
#                          `--profile dev up` also starts every profile-less
#                          default service and will collide on their ports.
#
# Every "-dev" sibling repeats its anchor's `environment:` map in full rather
# than adding to it: YAML's `<<:` merge key replaces a same-named key wholesale
# instead of deep-merging it, so a service that needs one different value
# (e.g. RUNNER_SERVER_URL pointing at a "-dev" dependency) must restate every
# other key too. Keep prod/dev pairs' shared keys in sync by hand.
name: agent-studio

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-orchestrator-api: &orchestrator-api
  restart: unless-stopped
  ports:
    - "127.0.0.1:${STUDIO_API_PORT:-5031}:5031"
  volumes:
    - workspace:/data/workspace
    - projects:/data/projects
  environment:
    TaskRepository: /data/workspace
    # Blank keeps OrchestratorApi in local mode. The distributed smoke test
    # sets this to the Task Server URL to exercise the /api/v1 proxy.
    TaskServer__BaseUrl: ${TASK_SERVER_BASE_URL:-}
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5031/healthz"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 10s
  logging: *bounded-logs

x-frontend: &frontend
  restart: unless-stopped
  ports:
    - "127.0.0.1:${STUDIO_UI_PORT:-4011}:8080"
  healthcheck:
    test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/healthz"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s
  logging: *bounded-logs

x-agent-host-coding: &agent-host-coding
  restart: unless-stopped
  env_file:
    - path: ./runner.env
      required: true
  environment:
    RUNNER_SERVER_URL: http://orchestrator-api:5031
    RUNNER_ROLE: coding
    # Compose-internal network: plain HTTP is an explicit, contained opt-in.
    RUNNER_ALLOW_INSECURE_HTTP: "1"
    RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner.token
  volumes:
    - runner-coding:/var/lib/agent-host
    - ./runner.token:/run/secrets/runner.token:ro
  logging: *bounded-logs

x-agent-host-review: &agent-host-review
  restart: unless-stopped
  env_file:
    - path: ./runner.env
      required: true
  environment:
    RUNNER_SERVER_URL: http://orchestrator-api:5031
    RUNNER_ROLE: review
    RUNNER_ALLOW_INSECURE_HTTP: "1"
    RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner.token
  volumes:
    - runner-review:/var/lib/agent-host
    - ./runner.token:/run/secrets/runner.token:ro
  logging: *bounded-logs

x-task-server: &task-server
  restart: unless-stopped
  ports:
    - "127.0.0.1:${STUDIO_TASKSERVER_PORT:-5071}:5071"
  volumes:
    - orchestrator-data:/var/lib/agent-orchestrator
  environment:
    LISTEN_URL: http://0.0.0.0:5071
    AllowedHosts: "*"
    STORE_PATH: /var/lib/agent-orchestrator
    AUTH: bearer
    STUDIO_AUTH_TOKEN_FILE: /run/secrets/studio_token
    ENGINE_AUTH_TOKEN_FILE: /run/secrets/engine_token
    BOOTSTRAP_RUNNER_ID: distributed-runner
    BOOTSTRAP_RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner_token
    BOOTSTRAP_REVIEW_RUNNER_ID: distributed-review-runner
    BOOTSTRAP_REVIEW_RUNNER_AUTH_TOKEN_FILE: /run/secrets/review_runner_token
  secrets:
    - source: studio_token
      uid: "10001"
      gid: "10001"
      mode: 0400
    - source: engine_token
      uid: "10001"
      gid: "10001"
      mode: 0400
    - source: runner_token
      uid: "10001"
      gid: "10001"
      mode: 0400
    - source: review_runner_token
      uid: "10001"
      gid: "10001"
      mode: 0400
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5071/healthz"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 10s
  logging: *bounded-logs

x-orchestrator-engine: &orchestrator-engine
  restart: unless-stopped
  environment:
    CLIENT_ID: orchestrator-engine
    # Empty by default: Compose interpolates every service's environment
    # block up front regardless of which profile is active, so a required
    # (`:?`) value here would break config validation for source-only paths.
    # orchestrator-engine itself refuses to start without a real credential
    # for a non-loopback SERVER_URL (orchestrator-engine/EngineOptions.cs) -
    # that is the actual enforcement point.
    CLIENT_CREDENTIAL: ${DISTRIBUTED_ENGINE_TOKEN:-}
  logging: *bounded-logs

x-studio-bff: &studio-bff
  restart: unless-stopped
  ports:
    - "127.0.0.1:${STUDIO_BFF_PORT:-5072}:5072"
  environment:
    TaskServer__AuthTokenFile: /run/secrets/studio_token
    Studio__AllowedOrigins: ${STUDIO_ALLOWED_ORIGINS:-http://127.0.0.1:4011,http://localhost:4011}
  secrets:
    - source: studio_token
      uid: "10001"
      gid: "10001"
      mode: 0400
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5072/healthz"]
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 10s
  logging: *bounded-logs

x-agent-host-distributed: &agent-host-distributed
  restart: unless-stopped
  env_file:
    - path: ./runner.env
      required: false
  environment:
    RUNNER_ID: distributed-runner
    RUNNER_NAME: distributed-runner
    RUNNER_ALLOW_INSECURE_HTTP: "1"
    RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner_token
    RUNNER_MAX_PARALLELISM: "1"
  secrets:
    - source: runner_token
      uid: "10001"
      gid: "10001"
      mode: 0400
  logging: *bounded-logs

services:
  orchestrator-api:
    <<: *orchestrator-api
    image: ghcr.io/agent-orc/agent-studio-api:${AGENT_STUDIO_IMAGE_TAG:-unpublished}
    volumes: []
    environment:
      TaskServer__BaseUrl: http://task-server:5071
      TaskServer__AuthTokenFile: /run/secrets/studio_token
    secrets:
      - source: studio_token
        uid: "10001"
        gid: "10001"
        mode: 0400
    depends_on:
      task-server:
        condition: service_healthy
    profiles: ["legacy"]

  orchestrator-api-dev:
    <<: *orchestrator-api
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: ${AGENT_STUDIO_VERSION:-0.0.0-dev}
    profiles: ["dev"]

  frontend:
    <<: *frontend
    image: ghcr.io/agent-orc/agent-studio-web:${AGENT_STUDIO_IMAGE_TAG:-unpublished}
    environment:
      STUDIO_API_UPSTREAM: studio-bff:5072
    depends_on:
      studio-bff:
        condition: service_healthy

  frontend-dev:
    <<: *frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VERSION: ${AGENT_STUDIO_VERSION:-0.0.0-dev}
    environment:
      STUDIO_API_UPSTREAM: studio-bff-dev:5072
    depends_on:
      studio-bff-dev:
        condition: service_healthy
    profiles: ["dev"]

  agent-host-coding:
    <<: *agent-host-coding
    image: ghcr.io/agent-orc/agent-host:${AGENT_STUDIO_IMAGE_TAG:-unpublished}
    profiles: ["legacy"]
    depends_on:
      - orchestrator-api

  agent-host-coding-dev:
    <<: *agent-host-coding
    build:
      context: .
      dockerfile: runner/Dockerfile
      args:
        VERSION: ${AGENT_STUDIO_VERSION:-0.0.0-dev}
    environment:
      RUNNER_SERVER_URL: http://orchestrator-api-dev:5031
      RUNNER_ROLE: coding
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner.token
    depends_on:
      - orchestrator-api-dev
    profiles: ["dev"]

  agent-host-review:
    <<: *agent-host-review
    image: ghcr.io/agent-orc/agent-host:${AGENT_STUDIO_IMAGE_TAG:-unpublished}
    profiles: ["legacy"]
    depends_on:
      - orchestrator-api

  agent-host-review-dev:
    <<: *agent-host-review
    build:
      context: .
      dockerfile: runner/Dockerfile
      args:
        VERSION: ${AGENT_STUDIO_VERSION:-0.0.0-dev}
    environment:
      RUNNER_SERVER_URL: http://orchestrator-api-dev:5031
      RUNNER_ROLE: review
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner.token
    depends_on:
      - orchestrator-api-dev
    profiles: ["dev"]

  task-server:
    <<: *task-server
    image: ghcr.io/agent-orc/agent-task-server:${AGENT_STUDIO_IMAGE_TAG:-unpublished}

  task-server-dev:
    <<: *task-server
    build:
      context: .
      dockerfile: task-server/Dockerfile
      args:
        VERSION: ${AGENT_STUDIO_VERSION:-0.0.0-dev}
    profiles: ["dev"]

  orchestrator-engine:
    <<: *orchestrator-engine
    image: ghcr.io/agent-orc/agent-orchestrator-engine:${AGENT_STUDIO_IMAGE_TAG:-unpublished}
    depends_on:
      task-server:
        condition: service_healthy
    environment:
      SERVER_URL: http://task-server:5071
      CLIENT_ID: orchestrator-engine
      CLIENT_CREDENTIAL: ${DISTRIBUTED_ENGINE_TOKEN:-}
      # Explicitly scoped to this private, disposable Compose network.
      ENGINE_ALLOW_INSECURE_HTTP: "1"

  orchestrator-engine-dev:
    <<: *orchestrator-engine
    build:
      context: .
      dockerfile: orchestrator-engine/Dockerfile
      args:
        VERSION: ${AGENT_STUDIO_VERSION:-0.0.0-dev}
    depends_on:
      task-server-dev:
        condition: service_healthy
    environment:
      SERVER_URL: http://task-server-dev:5071
      CLIENT_ID: orchestrator-engine
      CLIENT_CREDENTIAL: ${DISTRIBUTED_ENGINE_TOKEN:-}
      ENGINE_ALLOW_INSECURE_HTTP: "1"
    profiles: ["dev"]

  studio-bff:
    <<: *studio-bff
    image: ghcr.io/agent-orc/agent-studio-bff:${AGENT_STUDIO_IMAGE_TAG:-unpublished}
    depends_on:
      - task-server
    environment:
      TaskServer__BaseUrl: http://task-server:5071
      TaskServer__AuthTokenFile: /run/secrets/studio_token
      Studio__AllowedOrigins: ${STUDIO_ALLOWED_ORIGINS:-http://127.0.0.1:4011,http://localhost:4011}

  studio-bff-dev:
    <<: *studio-bff
    build:
      context: .
      dockerfile: studio-bff/Dockerfile
      args:
        VERSION: ${AGENT_STUDIO_VERSION:-0.0.0-dev}
    depends_on:
      - task-server-dev
    environment:
      TaskServer__BaseUrl: http://task-server-dev:5071
      TaskServer__AuthTokenFile: /run/secrets/studio_token
      Studio__AllowedOrigins: ${STUDIO_ALLOWED_ORIGINS:-http://127.0.0.1:4011,http://localhost:4011}
    profiles: ["dev"]

  agent-host-distributed:
    <<: *agent-host-distributed
    image: ghcr.io/agent-orc/agent-host:${AGENT_STUDIO_IMAGE_TAG:-unpublished}
    depends_on:
      - task-server
    environment:
      RUNNER_SERVER_URL: http://task-server:5071
      RUNNER_ID: distributed-runner
      RUNNER_NAME: distributed-runner
      RUNNER_ROLE: coding
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner_token
      RUNNER_MAX_PARALLELISM: "1"

  agent-host-review-distributed:
    <<: *agent-host-distributed
    image: ghcr.io/agent-orc/agent-host:${AGENT_STUDIO_IMAGE_TAG:-unpublished}
    depends_on:
      - task-server
    environment:
      RUNNER_SERVER_URL: http://task-server:5071
      RUNNER_ID: distributed-review-runner
      RUNNER_NAME: distributed-review-runner
      RUNNER_ROLE: review
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/review_runner_token
      RUNNER_MAX_PARALLELISM: "1"
    secrets:
      - source: review_runner_token
        uid: "10001"
        gid: "10001"
        mode: 0400

  agent-host-distributed-dev:
    <<: *agent-host-distributed
    build:
      context: .
      dockerfile: runner/Dockerfile
      args:
        VERSION: ${AGENT_STUDIO_VERSION:-0.0.0-dev}
    depends_on:
      - task-server-dev
    environment:
      RUNNER_SERVER_URL: http://task-server-dev:5071
      RUNNER_ID: distributed-runner
      RUNNER_NAME: distributed-runner
      RUNNER_ROLE: coding
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner_token
      RUNNER_MAX_PARALLELISM: "1"
    profiles: ["dev"]

  agent-host-review-distributed-dev:
    <<: *agent-host-distributed
    build:
      context: .
      dockerfile: runner/Dockerfile
      args:
        VERSION: ${AGENT_STUDIO_VERSION:-0.0.0-dev}
    depends_on:
      - task-server-dev
    environment:
      RUNNER_SERVER_URL: http://task-server-dev:5071
      RUNNER_ID: distributed-review-runner
      RUNNER_NAME: distributed-review-runner
      RUNNER_ROLE: review
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/review_runner_token
      RUNNER_MAX_PARALLELISM: "1"
    secrets:
      - source: review_runner_token
        uid: "10001"
        gid: "10001"
        mode: 0400
    profiles: ["dev"]

volumes:
  workspace:
  projects:
  runner-coding:
  runner-review:
  orchestrator-data:

secrets:
  studio_token:
    environment: DISTRIBUTED_STUDIO_TOKEN
  engine_token:
    environment: DISTRIBUTED_ENGINE_TOKEN
  runner_token:
    environment: DISTRIBUTED_RUNNER_TOKEN
  review_runner_token:
    environment: DISTRIBUTED_REVIEW_RUNNER_TOKEN
