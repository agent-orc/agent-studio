# Agent Studio - container-default stack.
#
# Default (no profile):    orchestrator API + frontend  -> a working Studio.
# --profile runner:        adds coding/review agent-hosts (needs runner.env
#                          with identity, auth token, and git remotes; the
#                          coding CLIs run INSIDE these containers - the
#                          container is the isolation boundary).
# --profile distributed:   target-architecture preview (task-server, engine,
#                          studio-bff) - not required for a working install.
name: agent-studio

services:
  orchestrator-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_API_PORT:-5031}:5031"
    volumes:
      - workspace:/data/workspace
      - projects:/data/projects
    environment:
      TaskRepository: /data/workspace
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5031/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      orchestrator-api:
        condition: service_healthy
    ports:
      - "${STUDIO_UI_PORT:-4011}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  agent-host-coding:
    build:
      context: .
      dockerfile: runner/Dockerfile
    profiles: ["runner"]
    restart: unless-stopped
    depends_on:
      - orchestrator-api
    env_file:
      - path: ./runner.env
        required: true
    environment:
      RUNNER_SERVER_URL: http://orchestrator-api:5031
      RUNNER_ROLE: coding
      # Compose-internal network: plain HTTP is an explicit, contained opt-in.
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner.token
    volumes:
      - runner-coding:/var/lib/agent-host
      - ./runner.token:/run/secrets/runner.token:ro

  agent-host-review:
    build:
      context: .
      dockerfile: runner/Dockerfile
    profiles: ["runner"]
    restart: unless-stopped
    depends_on:
      - orchestrator-api
    env_file:
      - path: ./runner.env
        required: true
    environment:
      RUNNER_SERVER_URL: http://orchestrator-api:5031
      RUNNER_ROLE: review
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner.token
    volumes:
      - runner-review:/var/lib/agent-host
      - ./runner.token:/run/secrets/runner.token:ro

  task-server:
    build:
      context: .
      dockerfile: task-server/Dockerfile
    profiles: ["distributed"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STUDIO_TASKSERVER_PORT:-5071}:5071"
    volumes:
      - orchestrator-data:/var/lib/agent-orchestrator
      - archive-data:/var/lib/agent-orchestrator/archive
      - backup-data:/var/lib/agent-orchestrator/backups
    environment:
      LISTEN_URL: http://0.0.0.0:5071
      AllowedHosts: "*"
      STORE_PATH: /var/lib/agent-orchestrator
      ARCHIVE_PATH: /var/lib/agent-orchestrator/archive
      BACKUP_PATH_FULL: /var/lib/agent-orchestrator/backups/full
      ARCHIVE_S3_ENDPOINT: ${ARCHIVE_S3_ENDPOINT:-}
      ARCHIVE_S3_BUCKET: ${ARCHIVE_S3_BUCKET:-}
      ARCHIVE_S3_PREFIX: ${ARCHIVE_S3_PREFIX:-}
      ARCHIVE_S3_REGION: ${ARCHIVE_S3_REGION:-us-east-1}
      ARCHIVE_S3_CREDENTIALS_FILE: /run/secrets/archive_s3_credentials
      ARCHIVE_S3_PATH_STYLE: ${ARCHIVE_S3_PATH_STYLE:-false}
      ARCHIVE_S3_SERVER_SIDE_CHECKSUM: ${ARCHIVE_S3_SERVER_SIDE_CHECKSUM:-true}
      AUTH: bearer
      STUDIO_AUTH_TOKEN_FILE: /run/secrets/studio_token
      ENGINE_AUTH_TOKEN_FILE: /run/secrets/engine_token
      BOOTSTRAP_RUNNER_ID: distributed-runner
      BOOTSTRAP_RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner_token
    secrets:
      - studio_token
      - engine_token
      - runner_token
      - archive_s3_credentials

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["archive-s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["archive-s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/${ARCHIVE_S3_BUCKET:-agent-studio-archive}
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}

  orchestrator-engine:
    build:
      context: .
      dockerfile: orchestrator-engine/Dockerfile
    profiles: ["distributed"]
    restart: unless-stopped
    depends_on:
      - task-server
    environment:
      SERVER_URL: http://task-server:5071
      CLIENT_ID: orchestrator-engine
      CLIENT_CREDENTIAL: ${DISTRIBUTED_ENGINE_TOKEN:?set DISTRIBUTED_ENGINE_TOKEN}

  studio-bff:
    build:
      context: .
      dockerfile: studio-bff/Dockerfile
    profiles: ["distributed"]
    restart: unless-stopped
    depends_on:
      - task-server
    ports:
      - "127.0.0.1:${STUDIO_BFF_PORT:-5072}:5072"
    environment:
      TaskServer__BaseUrl: http://task-server:5071
      TaskServer__AuthTokenFile: /run/secrets/studio_token
    secrets:
      - studio_token

  agent-host-distributed:
    build:
      context: .
      dockerfile: runner/Dockerfile
    profiles: ["distributed"]
    restart: unless-stopped
    depends_on:
      - task-server
    env_file:
      - path: ./runner.env
        required: false
    environment:
      RUNNER_SERVER_URL: http://task-server:5071
      RUNNER_ID: distributed-runner
      RUNNER_NAME: distributed-runner
      RUNNER_ALLOW_INSECURE_HTTP: "1"
      RUNNER_AUTH_TOKEN_FILE: /run/secrets/runner_token
    secrets:
      - runner_token

volumes:
  workspace:
  projects:
  runner-coding:
  runner-review:
  orchestrator-data:
  archive-data:
  backup-data:
  minio-data:

secrets:
  studio_token:
    environment: DISTRIBUTED_STUDIO_TOKEN
  engine_token:
    environment: DISTRIBUTED_ENGINE_TOKEN
  runner_token:
    environment: DISTRIBUTED_RUNNER_TOKEN
  archive_s3_credentials:
    file: ${ARCHIVE_S3_CREDENTIALS_FILE:-/dev/null}
